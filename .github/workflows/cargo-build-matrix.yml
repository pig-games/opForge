name: Cargo Build Matrix

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

jobs:
  build-release:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ffi_lib: libopforge.so
          - os: macos-latest
            ffi_lib: libopforge.dylib
          - os: windows-latest
            ffi_lib: opforge.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --workspace --exclude ffi --release --locked

      - name: Build release-ffi library
        run: cargo build -p ffi --profile release-ffi --locked --lib

      - name: Run release-ffi export coverage test
        env:
          OPFORGE_RELEASE_FFI_SKIP_BUILD: "1"
          OPFORGE_RELEASE_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/release-ffi/${{ matrix.ffi_lib }}
        run: cargo test -p ffi exported_release_ffi_library_exposes_full_header_symbol_surface --locked

      - name: Run release-ffi panic boundary smoke test
        run: cargo test -p ffi release_profile_catches_forced_ffi_panic --locked

      - name: Configure MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run FFI ABI contract test
        run: cargo test -p ffi exported_header_matches_rust_abi_contract --locked

      - name: Build vm-only embedded
        run: cargo build --release --locked --features vm-runtime-only

      - name: Build vm-only unbundled
        run: cargo build --release --locked --features vm-runtime-only,vm-runtime-opasm-unbundled
