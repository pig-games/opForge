name: Cargo Build Matrix

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

jobs:
  build-release:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --workspace --exclude ffi --release --locked

      - name: Build release-ffi library
        run: cargo build -p ffi --profile release-ffi --locked --lib

      - name: Run release-ffi panic boundary smoke test
        run: cargo test -p ffi release_profile_catches_forced_ffi_panic --locked

      - name: Run FFI ABI contract test
        run: cargo test -p ffi exported_header_matches_rust_abi_contract --locked

      - name: Build vm-only embedded
        run: cargo build --release --locked --features vm-runtime-only

      - name: Build vm-only unbundled
        run: cargo build --release --locked --features vm-runtime-only,vm-runtime-opasm-unbundled
