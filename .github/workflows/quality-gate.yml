name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

jobs:
  workflow-hygiene:
    name: workflow hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install workflow dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Validate workflow hygiene
        run: make workflow-gate

      - name: Validate native engineering contracts
        run: python3 scripts/workflow/run_native_porting_quality_gate.py

  release-note-integrity:
    name: tagged release-note integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed release notes
        env:
          COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="$COMPARISON_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          python3 scripts/workflow/check_release_notes_policy.py --base "$base"

  quality-gate:
    name: fmt + clippy + audit + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust quality gate
        run: scripts/workflow/run_rust_quality_gate.sh

  vm-opasm-modes:
    name: VM opasm modes + build combos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate vm package source modes
        run: make test-vm-opasm-modes

      - name: Validate build-profile matrix
        run: make test-build-profile-matrix

      - name: Validate build-combo smoke coverage
        run: make test-build-combo-smoke
