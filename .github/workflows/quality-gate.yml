name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

jobs:
  quality-gate:
    name: fmt + clippy + audit + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Security audit
        run: cargo audit

      - name: Require C compiler for FFI ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          for compiler in cc clang gcc; do
            if command -v "${compiler}" >/dev/null 2>&1; then
              "${compiler}" --version
              exit 0
            fi
          done
          echo "error: no supported C compiler found for FFI ABI contract coverage" >&2
          exit 1

      - name: Test suite
        run: cargo test --locked

  vm-opasm-modes:
    name: VM opasm modes + build combos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate vm package source modes
        run: make test-vm-opasm-modes

      - name: Validate build-profile matrix
        run: make test-build-profile-matrix

      - name: Validate build-combo smoke coverage
        run: make test-build-combo-smoke
