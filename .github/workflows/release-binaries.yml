name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to upload assets to (e.g. v0.9.4)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build & upload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_id: linux
            ext: ""
            ffi_lib: libopforge.so
          - os: macos-latest
            artifact_id: macos
            ext: ""
            ffi_lib: libopforge.dylib
          - os: windows-latest
            artifact_id: windows-msvc
            ext: .exe
            ffi_lib: opforge.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: cargo build --release --locked --bins

      - name: Build FFI library
        run: cargo build -p ffi --profile release-ffi --locked --lib

      - name: Run shipped release-ffi smoke test
        env:
          OPFORGE_RELEASE_FFI_SKIP_BUILD: "1"
          OPFORGE_RELEASE_FFI_LIBRARY_PATH: target/release-ffi/${{ matrix.ffi_lib }}
        run: cargo test -p ffi release_profile_loads_and_assembles_smoke --locked

      - name: Package release artifacts
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          BIN_EXT: ${{ matrix.ext }}
          FFI_LIB: ${{ matrix.ffi_lib }}
        run: |
          set -euo pipefail
          mkdir -p dist
          PKG_DIR="opforge-${TAG_NAME}-${ARTIFACT_ID}"
          mkdir -p "dist/${PKG_DIR}"

          cp "target/release/opforge${BIN_EXT}" "dist/${PKG_DIR}/opforge${BIN_EXT}"
          cp "target/release/opforge-lsp${BIN_EXT}" "dist/${PKG_DIR}/opforge-lsp${BIN_EXT}"
          cp "target/release-ffi/${FFI_LIB}" "dist/${PKG_DIR}/${FFI_LIB}"
          cp "crates/opforge-ffi/opforge.h" "dist/${PKG_DIR}/opforge.h"

          if [[ "${ARTIFACT_ID}" == "windows-msvc" ]]; then
            for import_lib in opforge.dll.lib opforge.lib; do
              if [[ -f "target/release-ffi/${import_lib}" ]]; then
                cp "target/release-ffi/${import_lib}" "dist/${PKG_DIR}/${import_lib}"
              fi
            done
          fi

          cp README.md "dist/${PKG_DIR}/"
          cp LICENSE "dist/${PKG_DIR}/"

      - name: Verify release package layout
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          BIN_EXT: ${{ matrix.ext }}
          FFI_LIB: ${{ matrix.ffi_lib }}
        run: |
          set -euo pipefail
          PKG_DIR="dist/opforge-${TAG_NAME}-${ARTIFACT_ID}"

          [[ -f "${PKG_DIR}/opforge${BIN_EXT}" ]]
          [[ -f "${PKG_DIR}/opforge-lsp${BIN_EXT}" ]]
          [[ -f "${PKG_DIR}/${FFI_LIB}" ]]
          [[ -f "${PKG_DIR}/opforge.h" ]]

          if [[ "${ARTIFACT_ID}" == "windows-msvc" ]]; then
            if [[ ! -f "${PKG_DIR}/opforge.dll.lib" && ! -f "${PKG_DIR}/opforge.lib" ]]; then
              echo "error: missing Windows import library in ${PKG_DIR}" >&2
              exit 1
            fi
          fi

      - name: Archive release artifacts
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          PKG_DIR="opforge-${TAG_NAME}-${ARTIFACT_ID}"
          tar -C dist -czf "dist/${PKG_DIR}.tar.gz" "${PKG_DIR}"

      - name: Generate checksums
        shell: bash
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          CHECKSUM_FILE="dist/SHA256SUMS-${ARTIFACT_ID}.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/*.tar.gz > "${CHECKSUM_FILE}"
          else
            shasum -a 256 dist/*.tar.gz > "${CHECKSUM_FILE}"
          fi

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
