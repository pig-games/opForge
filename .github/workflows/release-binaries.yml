name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Run the workflow without uploading assets to a GitHub release
        required: true
        default: true
        type: boolean
      tag_name:
        description: Release tag to package for when uploads are enabled (e.g. v0.9.4)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build & upload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_id: linux
            ext: ""
            ffi_lib: libopforge.so
          - os: macos-latest
            artifact_id: macos
            ext: ""
            ffi_lib: libopforge.dylib
          - os: windows-latest
            artifact_id: windows-msvc
            ext: .exe
            ffi_lib: opforge.dll

    steps:
      - name: Validate workflow inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.verify_only }}" != "true" && -z "${{ github.event.inputs.tag_name }}" ]]; then
            echo "error: tag_name is required when verify_only is false" >&2
            exit 1
          fi

      - name: Resolve checkout ref
        id: resolve_checkout_ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_ONLY: ${{ github.event.inputs.verify_only }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          set -euo pipefail

          checkout_ref="${GITHUB_REF_VALUE}"

          if [[ "${EVENT_NAME}" == "release" ]]; then
            checkout_ref="refs/tags/${RELEASE_TAG_NAME}"
          elif [[ "${VERIFY_ONLY}" != "true" ]]; then
            checkout_ref="refs/tags/${INPUT_TAG_NAME}"
          fi

          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_checkout_ref.outputs.checkout_ref }}

      - name: Resolve release tag name
        id: resolve_release_tag
        shell: bash
        env:
          CHECKOUT_REF: ${{ steps.resolve_checkout_ref.outputs.checkout_ref }}
          DEFAULT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag_name="${DEFAULT_REF_NAME}"
          if [[ "${CHECKOUT_REF}" == refs/tags/* ]]; then
            tag_name="${CHECKOUT_REF#refs/tags/}"
          fi

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: cargo build --release --locked --bins

      - name: Build FFI library
        run: cargo build -p ffi --profile release-ffi --locked --lib

      - name: Run shipped release-ffi smoke test
        env:
          OPFORGE_RELEASE_FFI_SKIP_BUILD: "1"
          OPFORGE_RELEASE_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/release-ffi/${{ matrix.ffi_lib }}
        run: cargo test -p ffi release_profile_loads_and_assembles_smoke --locked

      - name: Package release artifacts
        shell: bash
        env:
          TAG_NAME: ${{ steps.resolve_release_tag.outputs.tag_name }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          BIN_EXT: ${{ matrix.ext }}
          FFI_LIB: ${{ matrix.ffi_lib }}
        run: |
          set -euo pipefail
          SAFE_TAG_NAME="${TAG_NAME//\//-}"
          mkdir -p dist
          PKG_DIR="opforge-${SAFE_TAG_NAME}-${ARTIFACT_ID}"
          mkdir -p "dist/${PKG_DIR}"

          cp "target/release/opforge${BIN_EXT}" "dist/${PKG_DIR}/opforge${BIN_EXT}"
          cp "target/release/opforge-lsp${BIN_EXT}" "dist/${PKG_DIR}/opforge-lsp${BIN_EXT}"
          cp "target/release-ffi/${FFI_LIB}" "dist/${PKG_DIR}/${FFI_LIB}"
          cp "crates/opforge-ffi/opforge.h" "dist/${PKG_DIR}/opforge.h"

          if [[ "${ARTIFACT_ID}" == "windows-msvc" ]]; then
            for import_lib in opforge.dll.lib opforge.lib; do
              if [[ -f "target/release-ffi/${import_lib}" ]]; then
                cp "target/release-ffi/${import_lib}" "dist/${PKG_DIR}/${import_lib}"
              fi
            done
          fi

          cp README.md "dist/${PKG_DIR}/"
          cp LICENSE "dist/${PKG_DIR}/"

      - name: Verify release package layout
        shell: bash
        env:
          TAG_NAME: ${{ steps.resolve_release_tag.outputs.tag_name }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          BIN_EXT: ${{ matrix.ext }}
          FFI_LIB: ${{ matrix.ffi_lib }}
        run: |
          set -euo pipefail
          SAFE_TAG_NAME="${TAG_NAME//\//-}"
          PKG_DIR="dist/opforge-${SAFE_TAG_NAME}-${ARTIFACT_ID}"

          [[ -f "${PKG_DIR}/opforge${BIN_EXT}" ]]
          [[ -f "${PKG_DIR}/opforge-lsp${BIN_EXT}" ]]
          [[ -f "${PKG_DIR}/${FFI_LIB}" ]]
          [[ -f "${PKG_DIR}/opforge.h" ]]

          if [[ "${ARTIFACT_ID}" == "windows-msvc" ]]; then
            if [[ ! -f "${PKG_DIR}/opforge.dll.lib" && ! -f "${PKG_DIR}/opforge.lib" ]]; then
              echo "error: missing Windows import library in ${PKG_DIR}" >&2
              exit 1
            fi
          fi

      - name: Archive release artifacts
        shell: bash
        env:
          TAG_NAME: ${{ steps.resolve_release_tag.outputs.tag_name }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          SAFE_TAG_NAME="${TAG_NAME//\//-}"
          PKG_DIR="opforge-${SAFE_TAG_NAME}-${ARTIFACT_ID}"
          tar -C dist -czf "dist/${PKG_DIR}.tar.gz" "${PKG_DIR}"

      - name: Generate checksums
        shell: bash
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          CHECKSUM_FILE="dist/SHA256SUMS-${ARTIFACT_ID}.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/*.tar.gz > "${CHECKSUM_FILE}"
          else
            shasum -a 256 dist/*.tar.gz > "${CHECKSUM_FILE}"
          fi

      - name: Upload assets to release
        if: github.event_name == 'release' || github.event.inputs.verify_only != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_release_tag.outputs.tag_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
