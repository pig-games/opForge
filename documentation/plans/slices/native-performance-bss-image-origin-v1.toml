[slice]
schema_version = 2
name = "BSS image-origin and alignment suppression"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-rust-first-vm-native-amigaos-performance-optimization-plan-v0_1.md"
plan_item = "30 / Item A-bss-image-origin"
rust_reference = ["crates/opforge-asm/src/asmline_directives_data.rs::align_directive_ast", "crates/opforge-asm/src/line.rs::update_addresses", "crates/opforge-types/src/image.rs::ImageStore::output_range"]
native_boundary = ["native/motorola68000/amigaos/opasm/opasm_assembly_driver.asm", "native/motorola68000/amigaos/opasm/opasm_layout.asm"]
invariant = "BSS origins and alignment never establish or extend the flat emitted-image range, all unplaced sections retain their independent pass-one start across retries/final emission, and ordinary/mapped non-BSS image routes are unchanged."
assertion_decision = "Use complete same-source live Rust BIN oracles and fresh attempt-all native exact-artifact proof."
expected_inputs = "Placed CODE above unplaced or placed BSS at origin zero, small and full-U32 BSS reservations, placed BSS with a nonzero align-directive pad, ordinary forward/backward origins, and the established `.use ... map` logical-section source."
expected_outputs = "Exact one-byte CODE BIN for all BSS cases and exact 11-33-22 BIN for the ordinary-origin control, and exact 20-00-00-60-60 BIN for the mapped logical-section control."
known_non_equivalences = "Zero-image output, listing/footer parity, native unplaced sections first encountered under nonzero parent PC, other corpus debt and runtime gains remain open. Retained-start correction proves the complete start-zero fixtures, not universal unplaced-section semantics."
fast_proof_command = "cargo test --locked -p asm native_bss_image_origin_ -- --nocapture --test-threads=1"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test --locked -p asm native_bss_image_origin_ -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_bss_image_origin_live_rust_bss_align_pad"
proof_level = "A"
proves = "Rust records a three-byte alignment extent after a one-byte BSS reservation without emitting image bytes."
does_not_prove = "Native routing, native execution, whole-source BIN output or performance."

[[tests]]
name = "native_bss_image_origin_live_rust_bin_oracles"
proof_level = "A"
proves = "Complete live Rust CLI sources produce exact BIN bytes for every BSS and ordinary-origin case plus the established mapped-logical non-BSS source."
does_not_prove = "Native routing, native execution or performance."

[[tests]]
name = "native_bss_image_origin_unplaced_small_fs_uae"
proof_level = "D"
proves = "A fresh complete native source excludes an unplaced BSS origin below placed CODE from the exact BIN."
does_not_prove = "Placed BSS, alignment, full-U32 reservation, listing output or performance."

[[tests]]
name = "native_bss_image_origin_matrix_fs_uae"
proof_level = "D"
proves = "Fresh attempt-all native cases match exact live Rust BINs for placed/unplaced BSS, full-U32 reservation, BSS alignment and ordinary origins."
does_not_prove = "Mapped-logical routing, zero-image output, listing/footer parity, unrelated corpus closure or performance."

[[tests]]
name = "native_bss_image_origin_mapped_logical_control_fs_uae"
proof_level = "D"
proves = "The established complete `.use ... map` source is checked against its exact same-case live Rust BIN as a separate regression control."
does_not_prove = "BSS-origin suppression, cause or age of any observed failure, corpus closure or performance."
