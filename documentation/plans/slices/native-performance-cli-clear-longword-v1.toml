[slice]
schema_version = 2
name = "native aligned longword CLI clear"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-rust-first-vm-native-amigaos-performance-optimization-plan-v0_1.md"
plan_item = "38 / Item A-cli-clear-longword"
rust_reference = ["crates/opforge-asm/src/tests/native_harness_evidence.rs", "crates/opforge-asm/src/tests/native_production_corpus.rs"]
native_boundary = ["native/motorola68000/amigaos/opforge-cli/copy.asm::clearBytes", "native/motorola68000/amigaos/debug/opforge_platform_profile.asm"]
invariant = "Aligned longword clearing produces the exact requested zero bytes without touching canaries; it preserves SP,D2-D7,A1-A6, returns Z=1,N=V=C=0, preserves X for zero length and returns X=0 for nonzero length, advances A0 by count with D0=0, returns D1=0 for nonzero counts and preserves incoming D1 for zero/null, while retaining platform-profiler behavior."
assertion_decision = "No-go: fresh controlled Level E frontend ticks 706 to 678 (3.9660056657%) do not exceed 5%; reference outer-process formatter overlap is an additional timing limitation. Prototype and selector restored before expanded proof; no retained gain."
expected_inputs = "Nine native rows: zero/null; offset-1 counts 1/2/3 that exhaust before alignment; (offset,count) (0,512), (1,8), (2,8), (3,8), (0,65539), all with canaries and register/CCR sentinels; current B10 abort-after-one diagnostic and complete B03 corpus sources retain identical manifest, package, argv, modes and fixed timeout."
expected_outputs = "Exact zeroed requested ranges, untouched canaries, advanced A0/D0=0, D1=0 after nonzero counts, incoming D1 after zero, unchanged SP/D2-D7/A1-A6, Z=1/N=V=C=0, X unchanged for zero and X=0 for nonzero, plus exact profiler records; controlled Level E boundary/counters for timing and exact B03 live-Rust artifacts with explicit guest exit zero."
known_non_equivalences = "Controlled frontend ticks are development-loop evidence, not product timing or parity. A full B10 timeout provides no ratio or parity and remains A-close debt. Cleared-byte counts and instruction counts do not establish a speed gain."
fast_proof_command = "env -u OPFORGE_FS_UAE_SMOKE -u OPFORGE_FS_UAE_ARGS -u OPFORGE_FS_UAE_CONFIG_TEMPLATE CARGO_TARGET_DIR=target/step17-opt1 cargo test --locked -p asm native_platform_profile_ -- --nocapture --test-threads=1"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE=/tmp/opforge-performance.fs-uae OPFORGE_FS_UAE_ARGS='{fsuae_config}' OPFORGE_FS_UAE_POST_START_TIMEOUT_MS=120000 RUST_TEST_THREADS=1 CARGO_TARGET_DIR=target/step17-opt1 cargo test --locked -p asm external_fs_uae_native_platform_profile_cli_preserves_exact_artifact_and_exit -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_platform_profile_dos_wrappers_keep_one_operation_and_return_state"
proof_level = "B"
proves = "Existing generic copy/clear wrappers retain one profiler operation and caller-visible return-state contracts; independent source/ABI review covers each new align/long/tail branch."
does_not_prove = "Native data movement, canaries or timing."

[[tests]]
name = "native_bounded_progress_fs_uae_confirms_record_contract"
proof_level = "D"
proves = "The existing fresh native bounded-progress harness executes the nine-row zero/null, early-head, alignment/tail, large-count, canary and A0/D0/D1/CCR matrix in profile-off paths before BeginRun."
does_not_prove = "B03/B10 corpus behavior, product throughput or Phase A closure."

[[tests]]
name = "external_fs_uae_native_platform_profile_cli_preserves_exact_artifact_and_exit"
proof_level = "D"
proves = "The complete profiled CLI still produces its exact live-Rust artifact and explicit zero guest exit."
does_not_prove = "B03/B10 timing or A-close."

[[tests]]
name = "external_fs_uae_native_production_corpus_parity"
proof_level = "D"
proves = "A retained candidate produces exact completed B03 artifacts; a full B10 attempt supplies evidence only if it independently completes."
does_not_prove = "Parity or a timing ratio for incomplete B10, total runtime gain or Phase A closure."
