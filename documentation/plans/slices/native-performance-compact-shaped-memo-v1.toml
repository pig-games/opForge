invariant = "At most two fully validated shaped requests may reuse exact mnemonic-and-mode successful package-relative compact programs with deterministic successful-cold-store round-robin replacement; zero traffic, misses, errors and oversize requests do not evict, while the proven zero-shape memo, cold parser, bounds and package/pipeline lifecycle remain unchanged."
