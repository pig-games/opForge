expected_inputs = "Actual shipped/generated packages with repeated shaped keys, two-entry round-robin replacement, intervening zero requests, case/oversize/missing/malformed paths, successful/failed selection and reload; current B10 and B01 corpus inputs retain their package, argv, modes and 120000ms boundary. Corrupt-hit defensive bounds and valid-last publication are source/ABI review boundaries because immutable package fixtures do not fabricate cache corruption."
expected_outputs = "Exact program/status bytes and complete CLI artifacts with fresh explicit guest outcomes; candidate B10 completion only if it actually reaches DONE, otherwise an honestly retained timeout without a ratio."
known_non_equivalences = "The rejected prototype supplies no dynamic lifecycle proof, parity, native-image identity, timeout cause, measured hit count, speed gain, B10 closure, total Phase A gain, listing repair or broader debt closure. Current production remains the Step35 zero-shape memo."
fast_proof_command = "env -u OPFORGE_FS_UAE_SMOKE -u OPFORGE_FS_UAE_ARGS -u OPFORGE_FS_UAE_CONFIG_TEMPLATE CARGO_TARGET_DIR=target/step17-opt1 cargo test --locked -p asm native_compact_memo_ -- --nocapture --test-threads=1"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE=/tmp/opforge-performance.fs-uae OPFORGE_FS_UAE_ARGS='{fsuae_config}' OPFORGE_FS_UAE_POST_START_TIMEOUT_MS=120000 RUST_TEST_THREADS=1 CARGO_TARGET_DIR=target/step17-opt1 cargo test --locked -p asm native_compact_memo_ -- --nocapture --test-threads=1"
