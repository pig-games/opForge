[slice]
schema_version = 2
name = "native compact shaped successful-result memo"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-rust-first-vm-native-amigaos-performance-optimization-plan-v0_1.md"
plan_item = "36 / Item A-compact-shaped-memo"
rust_reference = ["crates/opforge-package/src/package/codec.rs", "crates/opforge-vm/src/runtime_model_core.rs::RuntimeModelCore::encode_candidates", "crates/opforge-asm/src/tests/native_compact_memo.rs", "crates/opforge-asm/src/tests/native_production_corpus.rs"]
