[slice]
schema_version = 2
name = "native compact zero-operand successful-result memo"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-rust-first-vm-native-amigaos-performance-optimization-plan-v0_1.md"
plan_item = "35 / Item A-compact-zero-memo"
rust_reference = ["crates/opforge-package/src/package/codec.rs", "crates/opforge-vm/src/runtime_model_core.rs::RuntimeModelCore::encode_candidates", "crates/opforge-asm/src/tests/native_production_corpus.rs"]
native_boundary = ["native/motorola68000/amigaos/tkpkg/tkpkg_compact_table.asm::findFixedProgramFromRequestV1", "native/motorola68000/amigaos/tkpkg/tkpkg_pipeline.asm::tkpkgPipelineSetActiveV1", "native/motorola68000/amigaos/tkpkg/tkpkg_buffers.asm"]
invariant = "Only a fully validated zero-shape request may reuse one exact-mnemonic successful package-relative compact program; bounds are revalidated and every package or pipeline transition invalidates publication."
assertion_decision = "Use actual decoded package expectations, API lifecycle transitions, a mixed CLI case, fail-closed negative statuses/diagnostics and alternating current B01 measurements; no stored filename selects an oracle."
expected_inputs = "Actual shipped and generated packages with zero-shape, changed-key, shaped, case, over-cap, selection, reload and malformed transitions; frozen B01 case 114ecc1e524a209c1756dd4cfec5cbcc010cbe483f17097bc5eefa8b4d45057d."
expected_outputs = "Exact returned program/status bytes for the lifecycle harness, exact mixed CLI artifact, and fresh explicit-zero-exit B01 artifacts for both uncached reference and memo candidate."
known_non_equivalences = "The positive B01 screen does not establish B03/B10 completion, total Phase A runtime, listing repair, lifecycle correctness or final retention before remaining gates pass."
fast_proof_command = "env -u OPFORGE_FS_UAE_SMOKE -u OPFORGE_FS_UAE_ARGS -u OPFORGE_FS_UAE_CONFIG_TEMPLATE CARGO_TARGET_DIR=target/step17-opt1 cargo test --locked -p asm native_compact_memo_ -- --nocapture --test-threads=1"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE=/tmp/opforge-performance.fs-uae OPFORGE_FS_UAE_ARGS='{fsuae_config}' OPFORGE_FS_UAE_POST_START_TIMEOUT_MS=120000 RUST_TEST_THREADS=1 CARGO_TARGET_DIR=target/step17-opt1 cargo test --locked -p asm native_compact_memo_ -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_compact_memo_live_rust_oracle"
proof_level = "A"
proves = "Actual package decode and lifecycle cases define expected program/status and CLI bytes."
does_not_prove = "Native execution."

[[tests]]
name = "native_item38_full_product_source_line_budget_contract"
proof_level = "B"
proves = "The actual canonical native product graph stays within its fixed source and processed-graph capacities; independent source/ABI review separately owns memo eligibility, bounds, publication and invalidation."
does_not_prove = "Lifecycle execution, ABI behavior or timing."

[[tests]]
name = "native_compact_memo_fs_uae"
proof_level = "D"
proves = "Fresh native lifecycle cases match their actual in-memory Rust/package expectations with explicit guest outcomes."
does_not_prove = "Mixed CLI output, B03/B10 completion, total runtime gain or Phase A closure."

[[tests]]
name = "native_compact_memo_mixed_cli_live_rust_oracle"
proof_level = "D"
proves = "A complete mixed-instruction CLI source matches its same-case live Rust artifact with fresh protocol and explicit guest exit."
does_not_prove = "Package reload lifecycle, B03/B10 completion, total runtime gain or Phase A closure."
