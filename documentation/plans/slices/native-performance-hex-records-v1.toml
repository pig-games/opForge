[slice]
schema_version = 2
name = "native sparse Intel HEX record parity"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-rust-first-vm-native-amigaos-performance-optimization-plan-v0_1.md"
plan_item = "23 / Item A-hex-records"
rust_reference = ["crates/opforge-types/src/image.rs::ImageStore::write_hex_file"]
native_boundary = ["native/motorola68000/amigaos/opasm/opasm_output_artifacts.asm::opasmOutputBuildHexArtifactV1"]
invariant = "Native Intel HEX output scans the existing image-presence map in ascending address order, starts a new data record at every address gap, and caps each contiguous record at Rust's 32-byte limit while preserving BIN bytes and the existing bounded artifact buffer."
assertion_decision = "Use Rust-owned sparse and 33-byte record oracles, a source-level native presence/capacity/bounds contract, and one fresh exact BIN/HEX guest proof. The writer adds no state, instrumentation, target-specific behavior, or new public API."
expected_inputs = "Present image bytes containing a discriminating address gap and a separate contiguous 33-byte run, with the existing image origin, byte-count bound, presence map, and artifact capacity."
expected_outputs = "Rust-identical uppercase Intel HEX data records split at gaps and after 32 bytes, the existing EOF record, unchanged BIN bytes, and fail-closed image/artifact bounds."
known_non_equivalences = "This slice does not change image storage, BIN, PRG, Hunk, S-record, map or listing semantics; extended-address and start-address behavior remain existing Rust/native scope. It makes no runtime-gain or Phase A completion claim."
fast_proof_command = "env -u OPFORGE_FS_UAE_SMOKE -u OPFORGE_FS_UAE_ARGS -u OPFORGE_FS_UAE_CONFIG_TEMPLATE cargo test --locked -p asm native_hex_records_ -- --nocapture --test-threads=1"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE=/tmp/opforge-performance.fs-uae OPFORGE_FS_UAE_ARGS='{fsuae_config}' OPFORGE_FS_UAE_POST_START_TIMEOUT_MS=120000 RUST_TEST_THREADS=1 cargo test --locked -p asm native_hex_records_gap_and_thirty_three_byte_fs_uae -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_hex_records_gap_and_thirty_three_byte_rust_oracle"
proof_level = "A"
proves = "The authoritative Rust writer emits separate records across an address gap and splits a contiguous 33-byte run at 32 bytes."
does_not_prove = "Native source behavior, AmigaOS execution, other artifact formats, or timing."

[[tests]]
name = "native_hex_records_writer_presence_cap_and_bounds_contract"
proof_level = "B"
proves = "The native writer consults image presence, caps records at 32 bytes, advances monotonically, and retains bounded artifact writes."
does_not_prove = "Native instruction encoding, OS behavior, exact artifact bytes, or unrelated output paths."

[[tests]]
name = "native_hex_records_gap_and_thirty_three_byte_fs_uae"
proof_level = "D"
proves = "Fresh guest completion with explicit zero exit produces exact live Rust BIN and HEX artifacts for the sparse and 33-byte discriminators."
does_not_prove = "Full B09 parity, other artifact formats, runtime gains, or Phase A closure."
