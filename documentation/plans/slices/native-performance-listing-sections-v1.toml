[slice]
schema_version = 2
name = "native listing section annotations"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-rust-first-vm-native-amigaos-performance-optimization-plan-v0_1.md"
plan_item = "25 / Item A-listing-sections"
rust_reference = ["crates/opforge-asm/src/engine.rs::Assembler::pass2", "crates/opforge-vm/src/listing.rs::ListingWriter::write_line"]
native_boundary = ["native/motorola68000/amigaos/opasm/opasm_engine.asm::opasmEngineGetStatementSourceRecordIndexV1", "native/motorola68000/amigaos/opasm/opasm_layout.asm::getListingSectionNameV1", "native/motorola68000/amigaos/opasm/opasm_output_artifacts.asm::opasmOutputBuildListingArtifactV1"]
invariant = "Each native listing source row carries Rust's post-processing active section annotation, derived monotonically from the first statement in a later source record or the final retained layout state, while labels and fixups retain their existing pre-dispatch statement ownership. Every listing write is checked against the unchanged 24,000-byte artifact buffer before it occurs."
assertion_decision = "Use a live Rust BIN/listing oracle with opening, interior comment/blank/data, and closing rows; source-level proof that native projects post-state from existing source-record and layout tables without rewriting ownership; an isolated host-Hunk encoding/relocation discriminator; a modeled exact-fit/overflow checked-append contract; and fresh positive and fail-closed native listing guest proofs."
expected_inputs = "One explicit section containing a comment, blank record, and three-byte data directive followed by endsection and placement, plus labeled opening/closing directives for independent ownership proof."
expected_outputs = "Rust-identical BIN and listing artifacts: the opening and in-section source rows include the active section name, the closing row reflects post-close state, boundary labels retain their pre-dispatch values, and a full or oversized listing fails before crossing the fixed buffer bound."
known_non_equivalences = "This slice does not change statement ownership, layout transitions, label/fixup semantics, listing capacity, other artifact formats, B09 disposition, runtime performance, or Phase A closure."
fast_proof_command = "env -u OPFORGE_FS_UAE_SMOKE -u OPFORGE_FS_UAE_ARGS -u OPFORGE_FS_UAE_CONFIG_TEMPLATE cargo test --locked -p asm native_listing_sections_ -- --nocapture --test-threads=1"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE=/tmp/opforge-performance.fs-uae OPFORGE_FS_UAE_ARGS='{fsuae_config}' OPFORGE_FS_UAE_POST_START_TIMEOUT_MS=120000 RUST_TEST_THREADS=1 cargo test --locked -p asm native_listing_sections_ -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_listing_sections_hunk_lea_symbol_addend_discriminator"
proof_level = "B"
proves = "The host assembler's isolated Hunk output distinguishes direct symbol-plus-addend LEA from base-address plus ADDA, retains the expected BSS relocation offsets, and preserves the reserve/pointer/private-call instruction forms."
does_not_prove = "The full native product's runtime listing end pointer, AmigaOS execution, or that this isolated encoding difference alone caused the observed guest failure."

[[tests]]
name = "native_listing_sections_live_rust_annotations_and_boundary_label_ownership"
proof_level = "A"
proves = "The authoritative Rust listing annotates opening and interior rows with the post-processing section, omits it after close, and retains pre-dispatch ownership for labels on both section boundaries."
does_not_prove = "Native source behavior, AmigaOS execution, bounded native writes, B09, or timing."

[[tests]]
name = "native_listing_sections_uses_monotonic_post_state_projection"
proof_level = "B"
proves = "Native listing projection advances through existing statement source-record indices, reads existing layout pre-state or final state, preserves the semantic ownership table, and checks listing append results."
does_not_prove = "Native instruction encoding, exact guest artifacts, all buffer boundary arithmetic, B09, or timing."

[[tests]]
name = "native_listing_sections_checked_append_exact_fit_and_overflow_contract"
proof_level = "C"
proves = "The production reserve helper's modeled compare contract accepts an exact-fit write and rejects a one-byte overflow, and the checked C-string adapter reserves before copying."
does_not_prove = "Real 68020 execution, every complete writer path, exact listing bytes, B09, or timing."

[[tests]]
name = "native_listing_sections_bin_and_listing_fs_uae"
proof_level = "D"
proves = "A fresh zero-exit native guest produces exact live Rust BIN and listing artifacts for the complete section annotation discriminator."
does_not_prove = "B09 completion, unrelated listing forms or artifacts, runtime gains, or Phase A closure."

[[tests]]
name = "native_listing_sections_capacity_failure_fs_uae"
proof_level = "D"
proves = "A fresh guest given a complete valid source whose live Rust listing exceeds 24,000 bytes returns a nonzero exit with OPC-NCLI044 instead of overrunning the fixed native listing buffer."
does_not_prove = "Exact-fit native execution, B09 completion, unrelated artifact failures, runtime gains, or Phase A closure."
