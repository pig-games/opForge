[slice]
schema_version = 2
name = "native canonical listing symbol footer"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-rust-first-vm-native-amigaos-performance-optimization-plan-v0_1.md"
plan_item = "32 / Item A-listing-symbol-footer"
rust_reference = ["crates/opforge-vm/src/listing.rs::write_symbol_table", "crates/opforge-vm/src/listing.rs::normalize_leading_label_colon"]
native_boundary = ["native/motorola68000/amigaos/opasm/opasm_output_artifacts.asm::opasmOutputBuildListingArtifactV2", "native/motorola68000/amigaos/opforge-cli/symbol_metadata.asm::labelIsPublicV1", "native/motorola68000/amigaos/opforge-cli/output.asm::buildLst"]
invariant = "Native listing source rows match Rust leading-label-colon normalization, and listing output emits each immutable root-module label's canonical engine name once, in Rust uppercase-key lexical order, without truncation, with exact placed address width and public/private visibility supplied through the CLI-owned export callback."
assertion_decision = "Use complete live Rust BIN/listing oracles, a source-level callback/metadata ownership check, and two separate fresh exact native cases so the simple footer and placed-address matrix localize independently."
expected_inputs = "One root-owned representative with two scrambled long mixed-case/punctuation labels, plus one root-owned matrix with immutable PC-backed BSS labels placed at 0x1000, 0x010000 and 0x12345678; both include one emitted CODE byte and explicit BIN/list outputs."
expected_outputs = "Exact one-byte AA BINs and exact whole Rust listings with canonical untruncated names, uppercase-key order, 4/6/8-digit placed values, and pub/prv lbl rows."
known_non_equivalences = "The native preprocessor's rejection of source labels beginning with underscore remains separate grammar debt; mutable var/set kind metadata, non-root/imported public visibility, generated-output and ORG footer debt, unrelated B09 artifacts, runtime gains and Phase A closure remain outside this root immutable-label slice."
fast_proof_command = "env -u OPFORGE_FS_UAE_SMOKE -u OPFORGE_FS_UAE_ARGS -u OPFORGE_FS_UAE_CONFIG_TEMPLATE CARGO_TARGET_DIR=target/step17-opt1 cargo test --locked -p asm native_listing_symbols_ -- --nocapture --test-threads=1; repeat for native_map_symbols_canonical_successor_and_export_contract and native_listing_sections_uses_monotonic_post_state_projection"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE=/tmp/opforge-performance.fs-uae OPFORGE_FS_UAE_ARGS='{fsuae_config}' OPFORGE_FS_UAE_POST_START_TIMEOUT_MS=120000 RUST_TEST_THREADS=1 CARGO_TARGET_DIR=target/step17-opt1 cargo test --locked -p asm native_listing_symbols_ -- --nocapture --test-threads=1; repeat for native_map_symbols_all_and_public_fs_uae"
level_d_fail_closed = true

[[tests]]
name = "native_listing_symbols_live_rust_normalizes_only_leading_label_colons"
proof_level = "A"
proves = "The actual Rust ListingWriter removes only a leading label colon, preserves indentation and comments, inserts spacing only when required, accepts identifier continuation punctuation, and leaves directive/comment/quoted operand colons unchanged."
does_not_prove = "Native execution or symbol-footer rendering."

[[tests]]
name = "native_listing_symbols_live_rust_canonical_footer_and_addresses"
proof_level = "A"
proves = "Complete live Rust sources define exact BIN/listing output, canonical uppercase-key order, long names, visibility and 4/6/8-digit placed label values."
does_not_prove = "Native execution, mutable/non-root metadata, generated footer parity or performance."

[[tests]]
name = "native_map_symbols_canonical_successor_and_export_contract"
proof_level = "B"
proves = "Map output consumes the shared CLI visibility/folded-name owner and preserves its complete-table successor traversal."
does_not_prove = "Native execution, listing byte output or broader symbol ownership."

[[tests]]
name = "native_listing_sections_uses_monotonic_post_state_projection"
proof_level = "B"
proves = "The complete listing renderer contract is bound to the explicit V2 implementation body while source-row mapping and capacity checks remain present."
does_not_prove = "Native instruction execution or exact listing bytes."

[[tests]]
name = "native_map_symbols_all_and_public_fs_uae"
proof_level = "D"
proves = "The unchanged fresh native map fixture retains exact live Rust all/public symbol ordering and visibility through the shared metadata helper."
does_not_prove = "Listing bytes, placed listing addresses, mutable/non-root symbols, generated footer parity or performance."

[[tests]]
name = "native_listing_symbols_representative_fs_uae"
proof_level = "D"
proves = "A fresh zero-exit guest produces the exact live Rust one-byte BIN and complete two-label canonical listing."
does_not_prove = "Six/eight-digit placement, mutable/non-root symbols, generated footer parity, B09 closure or performance."

[[tests]]
name = "native_listing_symbols_placed_addresses_fs_uae"
proof_level = "D"
proves = "A separate fresh zero-exit guest produces exact live Rust BIN/listing artifacts for root immutable labels placed at 4/6/8-digit addresses."
does_not_prove = "Mutable/non-root symbols, generated footer parity, unrelated B09 artifacts, runtime gains or Phase A closure."
