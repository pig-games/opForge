[slice]
schema_version = 2
name = "native listing visibility source rows"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-rust-first-vm-native-amigaos-performance-optimization-plan-v0_1.md"
plan_item = "26 / Item A-listing-visibility-source-rows"
rust_reference = ["crates/opforge-asm/src/engine.rs::Assembler::pass2", "crates/opforge-vm/src/listing.rs::ListingWriter::write_line"]
native_boundary = ["native/motorola68000/amigaos/opforge-cli/line_processor.asm::opforgeNativeCliProcessLineV1", "native/motorola68000/amigaos/opforge-cli/preprocessor.asm::opforgeNativeCliTrackVisibilityV1", "native/motorola68000/amigaos/opforge-cli/assembly_session.asm::opforgeNativeCliRecordSourceLine"]
invariant = "After an ordinary .pub or .priv directive successfully updates native visibility state, its original source line is retained exactly once through the existing assembly-session source-record boundary before the consumed path returns, without creating an assembly statement or changing package routing."
assertion_decision = "Use live Rust listing rows plus a separate Rust visibility-state oracle, a native source-order contract for the successful consumed path and failure propagation, and one fresh footer-neutral exact BIN/listing guest proof containing both visibility transitions."
expected_inputs = "A label-free explicit section containing .pub, one emitted byte, .priv, and a second emitted byte for exact artifacts, plus labeled public/private byte rows for the independent visibility-state oracle."
expected_outputs = "Rust-identical two-byte BIN and complete listing with each visibility directive retained once in source order and carrying continuous section annotation; labeled host symbols retain public and private visibility respectively."
known_non_equivalences = "This slice does not create statements for visibility directives, change visibility semantics, reparse listing source, change package routing, repair footer symbol metadata/order or sparse generated output, establish a runtime gain, complete B09, or close Phase A."
fast_proof_command = "env -u OPFORGE_FS_UAE_SMOKE -u OPFORGE_FS_UAE_ARGS -u OPFORGE_FS_UAE_CONFIG_TEMPLATE cargo test --locked -p asm native_listing_visibility_source_rows_ -- --nocapture --test-threads=1"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE=/tmp/opforge-performance.fs-uae OPFORGE_FS_UAE_ARGS='{fsuae_config}' OPFORGE_FS_UAE_POST_START_TIMEOUT_MS=120000 RUST_TEST_THREADS=1 cargo test --locked -p asm native_listing_visibility_source_rows_bin_and_listing_fs_uae -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_listing_visibility_source_rows_live_rust_order_and_state"
proof_level = "A"
proves = "Live Rust retains .pub and .priv listing rows exactly once in source order with section continuity, emits the expected BIN, and applies the transitions to labeled symbol visibility."
does_not_prove = "Native source behavior, AmigaOS execution, B09, footer parity, or timing."

[[tests]]
name = "native_listing_visibility_source_rows_consumed_path_records_once"
proof_level = "B"
proves = "The successful native visibility-consumed path records the original source once, propagates recording failure, and returns before statement parsing or package routing, after definition preprocessing precedence."
does_not_prove = "Native instruction encoding, real guest execution, exact listing bytes, B09, or timing."

[[tests]]
name = "native_listing_visibility_source_rows_bin_and_listing_fs_uae"
proof_level = "D"
proves = "A fresh zero-exit guest produces exact live Rust whole-listing and companion BIN artifacts for both visibility transitions in the footer-neutral discriminator."
does_not_prove = "Footer symbol metadata/order, sparse generated output, complete B09, runtime gains, or Phase A closure."
