[slice]
schema_version = 2
name = "native CLI deterministic diagnostic parity"
kind = "native-rust-parity"
rust_reference = [
  "crates/opforge-asm/src/tests.rs::native_reference_schema_live_rust_cli_diagnostic_oracle_classifies_unknown_mnemonic"
]
native_boundary = [
  "native/motorola68000/amigaos/opforge-cli/report.asm::opforgeNativeCliReport"
]
invariant = "The real native CLI rejects the governed unknown-mnemonic source and emits the same normalized diagnostic class as live Rust."
expected_inputs = "The reviewed unknown-mnemonic diagnostic schema case and live Rust oracle invocation."
expected_outputs = "Both implementations fail and emit the same normalized unknown-mnemonic diagnostic class."
known_non_equivalences = "Other diagnostic classes and exact wording parity are outside this slice."
fast_proof_command = "cargo test -p asm native_reference_schema_diagnostic_comparator_accepts_match_and_rejects_mismatch -- --nocapture"
level_d_command = "scripts/workflow/run_native_reference_retrospective_completion.sh"
level_d_fail_closed = true

[[tests]]
name = "native_reference_schema_diagnostic_comparator_accepts_match_and_rejects_mismatch"
proof_level = "B"
proves = "The comparator accepts the normalized diagnostic class and rejects a mismatch."
does_not_prove = "Real native CLI execution."

[[tests]]
name = "external_fs_uae_opforge_native_cli_schema_diagnostic_parity_matches_live_rust_cli"
proof_level = "D"
proves = "FS-UAE executes the real native CLI failure path and compares it with live Rust."
does_not_prove = "Other diagnostic classes or exact wording parity."
