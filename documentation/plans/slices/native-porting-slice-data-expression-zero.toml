[slice]
schema_version = 2
name = "native zero-valued data-expression parity"
kind = "native-rust-parity"
rust_reference = [
  "crates/opforge-asm/src/line.rs::AsmLine::eval_expr_for_data_directive",
  "crates/opforge-asm/src/line.rs::AsmLine::store_arg_list_ast",
]
native_boundary = [
  "native/motorola68000/amigaos/opasm/opasm_assembly_driver.asm::readCommaOperandValueForStatement",
]
invariant = "A successful native expression-service status accepts the returned scalar independently of its numeric truthiness; zero is data, not an unresolved-expression sentinel."
assertion_decision = "No runtime assertion: expression-service status already distinguishes evaluation failure, while the focused unresolved case proves that removing the redundant value check does not admit missing symbols."
expected_inputs = "Numeric .byte/.db comma-list operands whose valid bitwise or logical expressions evaluate to zero or nonzero, in first, middle, and final list positions."
expected_outputs = "Native size and emit passes accept successful zero values and produce the exact live Rust byte sequence; unresolved expressions still fail with guest-produced diagnostics."
known_non_equivalences = "Symbolic subtraction-to-zero, long string data operands, and later complete-fixture failures are separate invariants."
fast_proof_command = "cargo test -p asm native_data_expression_ -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm native_data_expression_ -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_data_expression_zero_rust_oracle"
proof_level = "A"
proves = "Live Rust accepts bitwise/logical zero expressions throughout a byte list, fixes their exact bytes, and rejects an unresolved expression."
does_not_prove = "Native evaluation or real guest execution."

[[tests]]
name = "native_data_expression_zero_dispatch_contract"
proof_level = "B"
proves = "The native comma-operand path branches on service status and no longer reclassifies a successful result according to D3 truthiness."
does_not_prove = "Real 68020 execution or emitted artifacts."

[[tests]]
name = "native_data_expression_zero_fs_uae"
proof_level = "D"
proves = "FS-UAE executes the real native CLI and exact output matches live Rust for zero/nonzero expressions in first, middle, and final list positions."
does_not_prove = "Other expression operators or string data operands."

[[tests]]
name = "native_data_expression_unresolved_fs_uae"
proof_level = "D"
proves = "FS-UAE executes the real native CLI and an unresolved data expression produces a guest completion marker, nonzero guest exit code, and diagnostics."
does_not_prove = "Exact Rust/native diagnostic wording parity."
