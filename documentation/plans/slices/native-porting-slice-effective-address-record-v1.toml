[slice]
schema_version = 2
name = "native frozen base operand-record execution v1"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 16
requirements = ["N68X0-001", "N68X0-003", "N68X0-004", "N68X0-005", "N68X0-014", "N68X0-015", "N68X0-016"]
rust_reference = [
  "crates/opforge-package/src/package/codec.rs::decode_compact_oprd_chunk",
  "crates/opforge-package/src/package.rs::validate_operand_record_program",
  "crates/opforge-vm/src/operand_record_vm.rs::execute_operand_record_program",
  "crates/opforge-vm/src/runtime_model_core.rs::execute_operand_record_program"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_package_loader.asm::CPRD locator activation",
  "native/motorola68000/amigaos/tkpkg/tkpkg_operand_record_service.asm::executeRequestV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_service.asm::handleExecuteOperandRecord",
  "native/motorola68000/amigaos/tkpkg/tkpkg_abi.asm::ENTRY_ORD_EXECUTE_OPERAND_RECORD"
]
invariant = "The native generic runtime validates the complete bounded CPRD owner/program set like Rust, resolves one opaque program id in dialect/CPU/family precedence, validates and executes the exact OPRD schema-v1 base program shape, and materializes the same neutral register, indirect/update, displacement/base, indexed/width/scale, absolute, or immediate record as Rust without interpreting any target-family spelling. Any request interval overlapping the distinct result buffer is rejected before request bytes are read or result bytes are materialized."
expected_inputs = "The exact unmodified Item 13.1 all-family package, an active package pipeline, an opaque program id, neutral `(u16 class, u16 index)` register references, and signed i64 scalar values."
expected_outputs = "One fixed 24-byte neutral v1 record matching the in-memory Rust PortableOperandRecord projection byte-for-byte; malformed chunks/programs/requests, unsupported schemas, missing programs, missing inputs, ambiguity, trailing bytes, invalid widths/scales/base/update tags, and bounds violations fail closed."
known_non_equivalences = "This slice does not encode instructions, add or change family/package definitions, implement structured OPRD schemas after the frozen base record, stabilize branches/fixups, add output formats, or claim complete 680x0 support."
fast_proof_command = "cargo test -p asm motorola68020_item16_native_base_operand_record_decoder_is_package_driven_and_fail_closed -- --nocapture && python3 scripts/workflow/check_cpu_specific_arch_boundary.py && python3 scripts/workflow/check_native_runtime_boundary_inventory.py"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm external_fs_uae_native_m68000_effective_address_record_parity -- --nocapture --test-threads=1"
regression_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 scripts/workflow/run_native_existing_parity_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "execution_model_reconstructs_base_operand_records_from_serialized_programs"
proof_level = "A"
proves = "The Rust model loaded from serialized package bytes reconstructs the cross-family base record contract and rejects missing inputs."
does_not_prove = "Native execution."

[[tests]]
name = "motorola68020_item16_native_base_operand_record_decoder_is_package_driven_and_fail_closed"
proof_level = "B"
proves = "The native source boundary owns the complete neutral CPRD/OPRD-v1 scope, opcode, exact-length, END, bounds, missing-input, distinct-result-buffer, and target-spelling guards while the embedded package remains byte-identical to a fresh Rust all-family build."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68000_effective_address_record_parity"
proof_level = "D"
proves = "Five fresh challenge-bound real Amiga guests are all attempted: one executes all 14 frozen base record forms from the exact unmodified package with isolated guest rows verified inside the runner against the same-case in-memory Rust oracle; four complete with explicit nonzero exits for missing input, request/result overlap, a malformed unselected structured program, and invalid UTF-8 in an unselected id."
does_not_prove = "Instruction encoding or any later structured operand-record schema."

[[tests]]
name = "native_existing_parity_completion_wrapper"
proof_level = "D"
proves = "All established native parity groups remain green for every already supported family and previously committed counted-.for/macro path."
does_not_prove = "New Item 17 instruction behavior."
