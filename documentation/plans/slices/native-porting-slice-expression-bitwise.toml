[slice]
schema_version = 2
name = "native bitwise expression parity"
kind = "native-rust-parity"
rust_reference = [
  "crates/opforge-core/src/parser.rs::parse_bit_and",
  "crates/opforge-core/src/parser.rs::parse_bit_xor",
  "crates/opforge-core/src/parser.rs::parse_bit_or",
  "crates/opforge-core/src/expr.rs::apply_binary",
]
native_boundary = [
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::compileLogicalOr/bitAnd/bitXor/bitOr",
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::compileAdditive",
  "native/motorola68000/amigaos/exprvm/exprvm_runtime.asm::opcodeApplyBinary",
]
invariant = "Native scalar comparisons bind more tightly than bitwise AND, bitwise AND binds more tightly than XOR, XOR binds more tightly than OR, and all bitwise operators bind more tightly than logical operators; operations evaluate in the native 32-bit value domain and yield doubled logical tokens upward."
assertion_decision = "No runtime assertion: malformed bitwise syntax returns checked parser failure; valid operations are total over the native scalar domain."
expected_inputs = "Scalar 65c02 constant expressions using `&`, `^`, and `|`, including mixed precedence, comparison operands, and adjacent doubled logical tokens."
expected_outputs = "Native CLI emits the same bytes as the live Rust assembler for bitwise values and precedence."
known_non_equivalences = "Range, logical AND/XOR, and ternary expression tiers remain outside this slice."
fast_proof_command = "cargo test -p asm native_expression_bitwise_ -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm native_expression_bitwise_fs_uae -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_expression_bitwise_rust_oracle"
proof_level = "A"
proves = "Live Rust establishes bitwise values, comparison/AND/XOR/OR precedence, and logical-token yielding."
does_not_prove = "Native parser or evaluator execution."

[[tests]]
name = "native_expression_bitwise_parser_runtime_contract"
proof_level = "B"
proves = "The native scoped tiers delegate in Rust precedence order, yield doubled tokens, and dispatch all bitwise runtime operations."
does_not_prove = "Real 68020 execution or final native CLI bytes."

[[tests]]
name = "native_expression_bitwise_fs_uae"
proof_level = "D"
proves = "FS-UAE executes the real native CLI and its bytes match live Rust for bitwise values and precedence."
does_not_prove = "Logical AND/XOR, ternary semantics, or malformed-bitwise diagnostic text."
