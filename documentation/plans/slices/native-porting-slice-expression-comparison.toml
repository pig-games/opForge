[slice]
schema_version = 2
name = "native comparison expression parity"
kind = "native-rust-parity"
rust_reference = [
  "crates/opforge-core/src/parser.rs::parse_compare",
  "crates/opforge-core/src/expr.rs::apply_binary",
]
native_boundary = [
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::compileLogicalOr/compare",
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::compileShift",
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::compileAdditive",
  "native/motorola68000/amigaos/exprvm/exprvm_runtime.asm::opcodeApplyBinary",
]
invariant = "Native scalar comparisons consume `==`, `!=`, `<>`, `<=`, `<`, `>=`, and `>` above shifts, associate to the left, compare signed 32-bit values, and project results to zero or one like Rust within the native value domain."
assertion_decision = "No runtime assertion: malformed comparison syntax returns checked parser failure; valid comparison results are normalized by the condition-code projection."
expected_inputs = "Scalar 65c02 constant comparisons covering every retained spelling, signed values, true/false results, and shift operands."
expected_outputs = "Native CLI emits the same zero/one bytes as the live Rust assembler."
known_non_equivalences = "Range, bitwise, remaining logical, and ternary expression tiers remain outside this slice."
fast_proof_command = "cargo test -p asm native_expression_comparison_ -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm native_expression_comparison_fs_uae -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_expression_comparison_rust_oracle"
proof_level = "A"
proves = "Live Rust establishes values for all retained comparison spellings, signed ordering, false projection, and shift/comparison precedence."
does_not_prove = "Native parser or evaluator execution."

[[tests]]
name = "native_expression_comparison_parser_runtime_contract"
proof_level = "B"
proves = "The native lower tiers yield comparison operators upward and the comparison parser/evaluator recognizes every spelling and normalizes signed conditions."
does_not_prove = "Real 68020 execution or final native CLI bytes."

[[tests]]
name = "native_expression_comparison_fs_uae"
proof_level = "D"
proves = "FS-UAE executes the real native CLI and its bytes match live Rust for all comparison spellings, signed ordering, precedence, and true/false projection."
does_not_prove = "Later bitwise/logical tiers or malformed-comparison diagnostic text."
