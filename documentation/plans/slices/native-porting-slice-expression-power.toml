[slice]
schema_version = 2
name = "native exponentiation expression parity"
kind = "native-rust-parity"
rust_reference = [
  "crates/opforge-core/src/parser.rs::parse_power",
  "crates/opforge-core/src/expr.rs::apply_binary",
]
native_boundary = [
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::compileMultiplicative/power",
  "native/motorola68000/amigaos/exprvm/exprvm_runtime.asm::opcodeApplyBinary",
]
invariant = "Native scalar exponentiation binds above multiplication, associates to the right, evaluates with wrapping 32-bit multiplication, and rejects negative exponents like the Rust reference within the native value domain."
assertion_decision = "No runtime assertion: a negative exponent or malformed power expression is a checked evaluator/parser failure and must return through the existing diagnostic path."
expected_inputs = "Scalar 65c02 constant expressions using `**`, including chained powers, multiplication on either side, zero exponents, and negative exponents."
expected_outputs = "Valid native CLI bytes equal live Rust bytes; invalid negative exponents fail closed."
known_non_equivalences = "Comparison, equality, bitwise, remaining logical, and ternary expression tiers remain outside this slice."
fast_proof_command = "cargo test -p asm native_expression_power_ -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm native_expression_power_fs_uae -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_expression_power_rust_oracle"
proof_level = "A"
proves = "The live Rust implementation establishes exponentiation values, precedence, right associativity, zero-exponent behavior, and negative-exponent rejection."
does_not_prove = "Native parser or evaluator execution."

[[tests]]
name = "native_expression_power_parser_runtime_contract"
proof_level = "B"
proves = "The native parser has a right-recursive power tier above multiplication and the native evaluator implements checked exponentiation by squaring."
does_not_prove = "Real 68020 execution or final native CLI bytes."

[[tests]]
name = "native_expression_power_fs_uae"
proof_level = "D"
proves = "FS-UAE executes the real native CLI and its output bytes match live Rust for exponentiation values, precedence, right associativity, and zero-exponent behavior."
does_not_prove = "Later expression-precedence tiers or negative-exponent diagnostic text."
