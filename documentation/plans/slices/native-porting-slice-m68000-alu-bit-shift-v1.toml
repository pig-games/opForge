[slice]
schema_version = 2
name = "native m68000 ALU bit shift and rotate package execution v1"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 18
requirements = ["N68X0-001", "N68X0-002", "N68X0-004", "N68X0-005", "N68X0-014", "N68X0-015", "N68X0-016"]
rust_reference = [
  "crates/opforge-vm/src/value_vm.rs::execute_value_program",
  "crates/opforge-vm/src/execution_model/encoding_bridge.rs::package_shape_input",
  "crates/opforge-vm/src/execution_model/selector_encoding.rs",
  "crates/opforge-vm/src/branch_vm.rs::execute_branch_program",
  "crates/opforge-vm/src/runtime_model_core.rs"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgExecuteValueProgramBytesV2",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgInferSelectedPackageShapeV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_operand_runtime.asm",
  "native/motorola68000/amigaos/tkpkg/tkpkg_encode_service.asm::tkpkgEncodeExecuteBranchProgramV5",
  "native/motorola68000/amigaos/opasm/opasm_engine.asm"
]
invariant = "For the ALU, compare, quick, immediate, unary, bit, shift, and rotate rows selected by the exact unmodified Rust package, the native generic runtime projects the same neutral inputs, executes the same package-owned VALUE_VM and semantic programs, and emits the same bytes or diagnostic as Rust without embedding CPU, mnemonic, register, addressing-mode, opcode, range, or legality authority."
assertion_decision = "No new runtime assertion: bounded decoder checks fail closed, while exact live-Rust Level D byte and diagnostic comparisons prove the corrected invariants."
expected_inputs = "The exact unmodified all-family package; the complete 68000_address_arithmetic_shifts, 68000_arithmetic_sizes, 68000_bit_operations, 68000_immediate_unary, and 68000_rotate_memory_shift source bytes; a CMPA boundary; and representative illegal ALU, immediate, unary, bit, and shift sources."
expected_outputs = "Byte-for-byte equality with same-source in-memory Rust oracles for every positive case, and explicit nonzero guest completion with the exact live Rust diagnostic for every negative case."
known_non_equivalences = "The native Amiga scalar transport is 32-bit, a fundamental platform boundary; all owned base-68000 value domains fit that transport. NEGX, NBCD, and TAS remain Item 20. The directed explicit-word BSR regression path does not claim Item 19 automatic branch sizing or multi-pass stability."
fast_proof_command = "cargo test -p asm motorola68020_item18_native_value_vm_v2_matches_rust_boundary -- --nocapture && python3 scripts/workflow/check_cpu_specific_arch_boundary.py && python3 scripts/workflow/check_native_runtime_boundary_inventory.py"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm external_fs_uae_native_m68000_alu_bit_shift_parity -- --nocapture --test-threads=1"
regression_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 scripts/workflow/run_native_existing_parity_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_item18_native_value_vm_v2_matches_rust_boundary"
proof_level = "B"
proves = "The native source boundary mirrors Rust's neutral VALUE_VM v1/v2, package-shape, CMSE kind-3, CSEM-v5 branch, semantic-diagnostic, and normalization contracts while the embedded package remains byte-identical to a fresh Rust build."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68000_alu_bit_shift_parity"
proof_level = "D"
proves = "Eleven independent fresh guests are all attempted: six compare the complete owned positive fixture boundary byte-for-byte with same-source live Rust oracles, while five require explicit nonzero completion and the exact live Rust diagnostic."
does_not_prove = "Remaining base forms, automatic branch sizing, later CPUs, output formats, or self-hosting."

[[tests]]
name = "directed_item18_exact_package_parity_cases"
proof_level = "D"
proves = "Fresh-guest exact-package cases isolate packed counts, member projection, semantic diagnostics, the normalization window, package-shape regressions, and the explicit-word forward-label branch correction exposed by the single broad run."
does_not_prove = "A second broad regression run or Item 19 branch-sizing and multi-pass stability."

[[tests]]
name = "native_existing_parity_completion_wrapper"
proof_level = "D"
proves = "The single Item 18 broad native invocation re-proves the complete established corpus and the eleven-case Item 18 group without being repeated after directed repairs."
does_not_prove = "That later directed repairs were followed by another broad run; the directed-fix quality gate explicitly forbids that repetition."
