[slice]
schema_version = 2
name = "native m68010 delta and legality v1"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 21
requirements = ["N68X0-001", "N68X0-002", "N68X0-006", "N68X0-014", "N68X0-015", "N68X0-016", "AC-M68KLINEAGE-001", "AC-M68KLINEAGE-002", "AC-M68KLINEAGE-003"]
rust_reference = [
  "crates/opforge-vm/src/execution_model/model_core_helpers.rs::scoped_owner_lookup_order",
  "crates/opforge-vm/src/execution_model/selector_bridge.rs::select_candidates_from_package_shape",
  "crates/opforge-vm/src/execution_model/selector_encoding.rs::semantic_plan_inputs",
  "crates/opforge-families/src/m68k/package_programs.rs::m68010_mode_selectors",
  "crates/opforge-families/src/m68k/package_programs.rs::m68010_instruction_programs",
  "crates/opforge-asm/src/tests.rs::m68010_delta_slice_emits_expected_bytes",
  "crates/opforge-asm/src/tests.rs::m68010_delta_and_m68000_rejection_diagnostics_are_deterministic"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgBuildSelectedEnvelopeFromCmseV7",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgProjectCompactSemanticInputV2",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgProjectNamedRegisterV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_buffers.asm::DeferredSemanticRejectBuffer",
  "native/motorola68000/amigaos/opforge-cli/opasm_event_report.asm::reportNoInstructionFound"
]
invariant = "For the exact unmodified Rust package, native resolves selector diagnostics with Rust's dialect-then-CPU-then-family precedence, compares package-declared named-register sources case-insensitively, and emits byte-for-byte Rust-equivalent m68010 bytes or the exact Rust-owned diagnostic without embedding CPU, instruction, register, opcode, range, or legality authority."
assertion_decision = "No ad-hoc instrumentation: each corrected neutral invariant is proved first by a directed Level B source contract and fresh challenge-bound Level D guests. The complete focused m68010 aggregate is attempted once; any issue it exposes is closed only by a directed small test without repeating the focused aggregate. After all directed proofs pass, the established native completion wrapper runs exactly once; any issue it exposes is likewise closed only by a directed small test without repeating the wrapper."
expected_inputs = "The exact unmodified all-family package; the complete 68010_delta fixture; CLI aliases 68010 and mc68010; baseline-CPU BKPT, MOVEC, MOVES, RTD, and MOVE-from-CCR rejections; and m68010 BKPT, MOVEC-control, MOVES-destination, and RTD-range failures."
expected_outputs = "Byte-for-byte equality with same-source in-memory Rust oracles for every positive source and explicit guest exit 1 carrying the same Rust diagnostic for every negative source."
known_non_equivalences = "Native transports scalar values as signed 32-bit quantities and uses bounded fixed storage, fundamental Amiga host differences that do not alter the owned m68010 value domains in this slice."
fast_proof_command = "cargo test -p asm m68010_item21_ -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm external_fs_uae_native_m68010_delta_parity -- --nocapture --test-threads=1"
regression_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 scripts/workflow/run_native_existing_parity_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "m68010_item21_named_register_matches_rust_boundary"
proof_level = "B"
proves = "Native directly mirrors Rust's package-owned named-register comparison, preserves the parse cursor, and defers semantic rejections by Rust's dialect-CPU-family owner precedence and within-owner priority."
does_not_prove = "Execution by a real Amiga guest or the complete m68010 delta."

[[tests]]
name = "external_fs_uae_native_m68010_named_register_diagnostic_parity"
proof_level = "D"
proves = "One fresh guest selects the CPU-specific m68010 rejection over the family fallback and returns the exact live Rust unsupported-control-register diagnostic with guest exit 1."
does_not_prove = "Positive MOVEC encoding, other m68010 forms, aliases, or other legality cases."

[[tests]]
name = "m68010_item21_delta_corpus_matches_rust_boundary"
proof_level = "B"
proves = "The authoritative 68010_delta fixture remains byte-identical to its established Rust S-record and listing references, all required package program and diagnostic boundaries remain present, and the embedded package equals a fresh Rust rebuild."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "m68010_item21_no_instruction_diagnostic_matches_rust_boundary"
proof_level = "B"
proves = "Native mirrors Rust's generic uppercasing of the full path-supplied mnemonic from bounded statement metadata without owning CPU or instruction vocabulary."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68010_delta_parity"
proof_level = "D"
proves = "Fresh guests execute the complete m68010 fixture, both CLI aliases, five baseline rejections, and four m68010 legality diagnostics against same-source live Rust oracles with explicit guest completion and exits."
does_not_prove = "68020+ features, output-format completion, self-hosting, or the complete established native regression corpus."

[[tests]]
name = "external_fs_uae_native_m68010_baseline_rejection_diagnostic_parity"
proof_level = "D"
proves = "Four fresh guests close the single shared renderer defect exposed by the Item 21 aggregate for baseline BKPT, MOVEC, MOVES.W, and RTD rejections, each against a same-source live Rust diagnostic with explicit guest exit 1."
does_not_prove = "Positive m68010 encoding, m68010 legality diagnostics, aliases, or unrelated native parity paths."

[[tests]]
name = "external_fs_uae_native_m68010_moves_rejection_diagnostic_parity"
proof_level = "D"
proves = "One fresh guest closes the sole residual directed-test case by preserving the live Rust CLI's MOVES.W mnemonic in the generic diagnostic with explicit guest exit 1."
does_not_prove = "Any other renderer case or positive encoding path."

[[tests]]
name = "native_existing_parity_completion_wrapper"
proof_level = "D"
proves = "One post-focused Item 21 invocation re-proves every established native parity shard and the m68010 aggregate."
does_not_prove = "A second wrapper run after directed repairs; the Directed-Fix and Single Native Completion Quality Gate forbids repetition."
