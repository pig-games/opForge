[slice]
schema_version = 2
name = "native m68020 full-extension addressing v1"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 22
requirements = ["N68X0-001", "N68X0-002", "N68X0-003", "N68X0-004", "N68X0-005", "N68X0-014", "N68X0-015", "N68X0-016", "AC-M68KLINEAGE-004", "AC-M68KLINEAGE-005"]
rust_reference = [
  "crates/opforge-vm/src/execution_model/selector_encoding.rs::project_expr_path",
  "crates/opforge-vm/src/execution_model/selector_encoding.rs::semantic_plan_inputs",
  "crates/opforge-vm/src/operand_record_vm.rs::execute_operand_record_program_with_records",
  "crates/opforge-families/src/m68k/package_programs.rs::m68k_mode_selectors",
  "crates/opforge-families/src/m68k/package_programs.rs::m68k_operand_record_programs",
  "crates/opforge-families/src/m68k/handler.rs::parses_canonical_68020_full_extension_operands",
  "crates/opforge-asm/src/tests.rs::later_m68k_cpus_accept_full_extension_shared_baseline_surface",
  "crates/opforge-asm/src/tests.rs::later_m68k_cpus_accept_moves_with_full_extension_addressing"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgProjectCompactSemanticInputV2",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgProjectExprPathV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgProjectNonidentityScaleV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_operand_record_service.asm::executeProgramV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_operand_record_service.asm::executeNestedAddress",
  "native/motorola68000/amigaos/tkpkg/tkpkg_abi.asm::OPERAND_RECORD_RESULT_VERSION_V2"
]
invariant = "For the exact unmodified Rust package, native walks the frozen full-extension expression paths, detects nonidentity tuple scales, and materializes schema-v2 nested-address records with the same neutral structure as Rust. CPU availability, register classes/indices, tuple paths, qualifiers, field widths, scale meaning, encoding constants, and diagnostics remain package-owned."
assertion_decision = "No ad-hoc instrumentation: each missing neutral operation is first proved by its directed Level B contract and fresh challenge-bound Level D case. Only after all directed proofs pass does the established native completion wrapper run exactly once; any issue exposed there is closed only by a directed small test without repeating the wrapper."
expected_inputs = "The exact unmodified all-family package; the complete 68020 full-extension fixture on m68020/m68030/m68040; direct, preindexed, postindexed, canonical and alias source forms; baseline m68000/m68010 rejection forms; and all four frozen schema-v2 nested-address record programs covering base suppression and index suppression."
expected_outputs = "Byte-for-byte equality with same-source live Rust CLI or in-memory operand-record VM oracles for every positive case, plus exact Rust diagnostics and explicit nonzero guest exits for baseline rejection and missing-input cases."
known_non_equivalences = "Native scalar evaluation and bounded request storage use the established 32-bit Amiga transport, a fundamental platform difference that does not alter the full-extension displacement, register, width, scale, or indirection domains exercised here."
fast_proof_command = "cargo test -p asm motorola68020_item22_ -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm external_fs_uae_native_m68020_full_extension_addressing_parity -- --nocapture --test-threads=1"
regression_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 scripts/workflow/run_native_existing_parity_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_item22_expr_path_matches_rust_boundary"
proof_level = "B"
proves = "Native mirrors the Rust xp1 container/terminal subset consumed by frozen full-extension selector rows and resolves package-owned register encodings."
does_not_prove = "Guest execution, baseline rejection, or structured operand records."

[[tests]]
name = "external_fs_uae_native_m68020_expr_path_projection_parity"
proof_level = "D"
proves = "One fresh guest executes both Rust-equivalent direct tuple spellings plus preindexed and postindexed xp1 paths against exact same-source live Rust bytes with explicit exit zero."
does_not_prove = "Baseline rejection, later CPU carry-forward, or structured operand records."

[[tests]]
name = "motorola68020_item22_nonidentity_scale_matches_rust_boundary"
proof_level = "B"
proves = "Native mirrors Rust's right-before-left nonidentity multiplication predicate over the package-selected operand or tuple item."
does_not_prove = "Guest diagnostics or positive full-extension encoding."

[[tests]]
name = "external_fs_uae_native_m68020_nonidentity_scale_rejection_parity"
proof_level = "D"
proves = "Fresh m68000 and m68010 guests reject direct and nested nonidentity scales with exact live Rust diagnostics and explicit exit one."
does_not_prove = "Positive later-CPU encoding or structured operand records."

[[tests]]
name = "motorola68020_item22_nested_operand_record_matches_rust_boundary"
proof_level = "B"
proves = "The native versioned v2 wire layout and executor directly represent Rust's four frozen NestedAddress programs while preserving v1 bytes."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68020_nested_operand_record_parity"
proof_level = "D"
proves = "Two fresh guests prove all four v2 nested-address records byte-for-byte against the in-memory Rust VM and fail closed on a missing outer-displacement input."
does_not_prove = "CLI instruction selection or later schema-v2/v3 record opcodes."

[[tests]]
name = "motorola68020_item22_full_extension_corpus_matches_rust_boundary"
proof_level = "B"
proves = "The complete Rust full-extension test/fixture/reference corpus and exact embedded package are present and unchanged."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68020_full_extension_addressing_parity"
proof_level = "D"
proves = "Fresh guests prove the complete fixture on 68020/030/040, canonical aliases, baseline rejections, and base/index suppression records against authoritative Rust oracles."
does_not_prove = "Later 68020 instruction groups, target-state directives, FPU/MMU behavior, output-format completion, or self-hosting."

[[tests]]
name = "native_existing_parity_completion_wrapper"
proof_level = "D"
proves = "One Item 22 invocation re-proves every established native parity shard and executes the complete Item 22 aggregate exactly once."
does_not_prove = "A second wrapper run after any directed repair; the Directed-Fix and Single Native Completion Quality Gate forbids repetition."
