[slice]
schema_version = 2
name = "native m68020 later integer group A v1"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 23
requirements = ["N68X0-001", "N68X0-002", "N68X0-004", "N68X0-014", "N68X0-015", "N68X0-016", "AC-M68KLINEAGE-006"]
rust_reference = [
  "crates/opforge-vm/src/execution_model/selector_encoding.rs::semantic_duplicate_register",
  "crates/opforge-vm/src/execution_model/selector_encoding.rs::semantic_plan_inputs",
  "crates/opforge-families/src/m68k/package_programs.rs::m68020_mode_selectors",
  "crates/opforge-asm/src/tests.rs::m68020_first_instruction_group_assembles",
  "crates/opforge-asm/src/tests.rs::m68020_long_branch_family_assembles",
  "examples/motorola68000/68020_later_families.asm"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgProjectCompactSemanticInputV2",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgProjectCallArgRegisterV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgSelectCallArgumentV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgProjectDistinctRegisterV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgProjectDuplicateRegisterV1"
]
invariant = "For the exact unmodified Rust package, native projects frozen direct and indirect call-argument registers and applies Rust's recursive distinct-register predicate while leaving CPU availability, mnemonics, operand forms, register classes and encodings, opcodes, field meanings, legality, and diagnostics entirely package-owned."
assertion_decision = "No ad-hoc instrumentation: each corrected neutral invariant is proved first by a directed Level B source contract and fresh challenge-bound Level D guests. Only after every directed proof and non-emulator contract passes does the complete established native parity wrapper run once; any issue it exposes is closed only by a directed small test without repeating the wrapper."
expected_inputs = "The exact unmodified all-family package; long branches, LINK.L, EXTB.L, long scalar and pair multiply/divide, CAS/CAS2, and CHK2/CMP2 group-A forms on m68020; duplicate or missing pair legality cases; and representative earlier-CPU rejection cases. CAS2 field legality remains explicitly deferred to Item 24."
expected_outputs = "Byte-for-byte equality with same-source live Rust oracles for every positive source and explicit guest exit 1 carrying the same Rust diagnostic for every negative source."
known_non_equivalences = "Native transports scalar values as signed 32-bit quantities and uses bounded 16-bit text lengths and fixed storage, fundamental Amiga host differences that do not alter the Rust-owned group-A value and source domains exercised here."
fast_proof_command = "cargo test -p asm motorola68020_item23_ -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm external_fs_uae_native_m68020_later_integer_group_a_parity -- --nocapture --test-threads=1"
regression_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 scripts/workflow/run_native_existing_parity_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_item23_call_arg_register_matches_rust_boundary"
proof_level = "B"
proves = "Native directly mirrors Rust's frozen direct and indirect call-argument register projection and preserves the remaining source cursor across decimal argument parsing."
does_not_prove = "Execution by a real Amiga guest or distinct-register behavior."

[[tests]]
name = "external_fs_uae_native_m68020_call_arg_register_parity"
proof_level = "D"
proves = "One fresh challenged guest executes a CAS2.L source that consumes both direct and indirect argument projections, producing exact same-source live Rust bytes and explicit guest exit zero."
does_not_prove = "Distinct-register rejection, other group-A forms, or CAS2 field legality."

[[tests]]
name = "motorola68020_item23_distinct_register_matches_rust_boundary"
proof_level = "B"
proves = "Native implements Rust's distinct-register semantic by inverting the existing neutral duplicate visitor over both slash lists and colon call arguments without target-specific ownership."
does_not_prove = "Execution by a real Amiga guest or complete group-A coverage."

[[tests]]
name = "external_fs_uae_native_m68020_distinct_register_parity"
proof_level = "D"
proves = "Two fresh challenged guests prove one exact distinct DIVS.L pair and one duplicate-pair live Rust diagnostic with explicit guest exits zero and one."
does_not_prove = "Other group-A positive or earlier-CPU rejection forms."

[[tests]]
name = "motorola68020_item23_later_integer_group_a_matches_rust_boundary"
proof_level = "B"
proves = "The frozen Rust group-A package rows, authoritative later-family fixture, and exact embedded Rust-built package remain present and unchanged."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68020_later_integer_group_a_parity"
proof_level = "D"
proves = "Fresh guests prove long branches, LINK.L, EXTB.L, long multiply/divide, CAS/CAS2, and CHK2/CMP2 positive, pair/register legality, and earlier-CPU negative cases against authoritative live Rust oracles with explicit guest completion and exits."
does_not_prove = "Item 24 group-B forms or CAS2 field legality, later target-state families, output-format completion, or self-hosting."

[[tests]]
name = "native_existing_parity_completion_wrapper"
proof_level = "D"
proves = "One Item 23 invocation re-proves every established native parity shard and executes the complete Item 23 aggregate exactly once."
does_not_prove = "A second wrapper run after any directed repair; the Directed-Fix and Single Native Completion Quality Gate forbids repetition."
