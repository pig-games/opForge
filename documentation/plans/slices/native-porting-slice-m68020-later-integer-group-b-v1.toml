invariant = "For the exact unmodified Rust package, native mirrors Rust's neutral postfix-call argument, member, indirect-tuple-register, relocation-target, and signed out-of-range projections; original source syntax distinguishes explicit `.pack` from a bare package mnemonic after native metadata normalization, while all CPU availability, mnemonics, operand forms, opcodes, field meanings, legality, and diagnostics remain package-owned."
assertion_decision = "No ad-hoc instrumentation: every corrected neutral invariant is proved with a directed Level B contract and fresh challenge-bound Level D guest. After all directed proofs and deterministic gates pass, the complete established native parity wrapper runs exactly once; any issue it exposes is closed only with a directed small test and the wrapper is not repeated."
expected_inputs = "The exact unmodified all-family package; the checked-in 68020_later_families fixture; register, absolute-word, bare-symbol, qualified-symbol, and indirect bit fields; PACK/UNPK; TRAPcc; CALLM/RTM; long-divide aliases; legal and PC-relative MOVES; legal and illegal CAS2 field layouts; and representative earlier-CPU rejection cases."
expected_outputs = "Byte-for-byte equality with same-source live Rust oracles for every positive source and explicit guest exit 1 carrying the same Rust diagnostic for every negative source."
known_non_equivalences = "Native transports scalar values as signed 32-bit quantities and uses bounded 16-bit text lengths and fixed storage, fundamental Amiga host differences that do not alter the Rust-owned Item 24 source/value domains exercised here. Native target projection currently recognizes the direct-identifier subset used by the frozen bit-field package rows, including one parenthesized member base; broader Rust target expression recursion is not claimed."
fast_proof_command = "cargo test -p asm motorola68020_item24_ -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm external_fs_uae_native_m68020_later_integer_group_b_parity -- --nocapture --test-threads=1"
regression_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 scripts/workflow/run_native_existing_parity_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_item24_call_arg_value_matches_rust_boundary"
proof_level = "B"
proves = "Native mirrors Rust's neutral postfix-call scalar argument projection and delegates expression meaning to the established bridge."
does_not_prove = "Relocation-target projection or execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68020_call_arg_value_parity"
proof_level = "D"
proves = "One fresh challenged guest emits exact live-Rust BFTST register bytes through postfix-call scalar projection with explicit exit zero."
does_not_prove = "Target/member or other group-B forms."

[[tests]]
name = "motorola68020_item24_call_arg_value_target_matches_rust_boundary"
proof_level = "B"
proves = "Native structurally selects the Rust package-declared call argument for direct-identifier relocation matching and leaves value evaluation to fixup."
does_not_prove = "Broader recursive relocation expressions or execution by a real guest."

[[tests]]
name = "external_fs_uae_native_m68020_call_arg_value_target_parity"
proof_level = "D"
proves = "One fresh challenged guest applies the package absolute-long fixup to BFTST target and emits exact live-Rust bytes with explicit exit zero."
does_not_prove = "Member-target projection."

[[tests]]
name = "motorola68020_item24_call_arg_member_matches_rust_boundary"
proof_level = "B"
proves = "Native mirrors Rust's case-insensitive selected-member field check and evaluates only the member base."
does_not_prove = "Relocation-member matching or execution by a real guest."

[[tests]]
name = "external_fs_uae_native_m68020_call_arg_member_parity"
proof_level = "D"
proves = "One fresh challenged guest emits exact live-Rust BFEXTU absolute-word bytes through selected-member projection with explicit exit zero."
does_not_prove = "Member-target fixups."

[[tests]]
name = "motorola68020_item24_call_arg_member_target_matches_rust_boundary"
proof_level = "B"
proves = "Native mirrors Rust's selected member-target field and relocation-base checks for the frozen direct-identifier member subset."
does_not_prove = "Broader recursive relocation expressions or execution by a real guest."

[[tests]]
