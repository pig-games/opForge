[slice]
schema_version = 2
name = "native m68030 m68040 integer and narrow MMU v1"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 26
requirements = ["N68X0-001", "N68X0-002", "N68X0-006", "N68X0-014", "N68X0-015", "N68X0-016", "AC-M68KLINEAGE-007", "AC-M68KLINEAGE-008", "AC-M68KMF-003", "AC-M68KMF-004", "AC-M68KMF-006"]
rust_reference = [
  "crates/opforge-families/src/m68k/package_programs.rs::m68020_instruction_programs",
  "crates/opforge-families/src/m68k/package_programs.rs::m68020_mode_selectors",
  "crates/opforge-families/src/m68k/package_programs.rs::m68020_register_encodings",
  "crates/opforge-families/src/m68k/package_programs.rs::semantic_programs",
  "crates/opforge-families/src/m68030/handler.rs",
  "crates/opforge-families/src/m68040/handler.rs"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm",
  "native/motorola68000/amigaos/tkpkg/tkpkg_operand_runtime.asm",
  "native/motorola68000/amigaos/tkpkg/tkpkg_encode_service.asm",
  "native/motorola68000/amigaos/tkpkg/tkpkg_compact_table.asm::findFixedProgramFromRequestV1"
]
invariant = "Native resolves and executes the exact Rust-built CPU-scoped selector, register-encoding, semantic-encoding, and diagnostic records for inherited m68030/m68040 integer forms, m68030/m68040 PFLUSH, m68040 MMU MOVEC, and m68040 MOVE16 without introducing a native CPU, mnemonic, control-register, opcode, or legality table."
assertion_decision = "Each corrected invariant is proved by a directed Level B or fresh challenge-bound Level D test. After all directed tests pass, the complete established native parity wrapper runs exactly once; any issue it exposes is fixed and proved only by a directed small test without repeating the wrapper."
expected_inputs = "The exact unmodified Rust-built all-family package, an explicitly selected m68030 or m68040 CPU, and exact source bytes covering inherited integer forms including ADDA.W, PFLUSH, MMU MOVEC, MOVE16, explicit later-CPU restrictions, and unshipped PMMU mnemonics."
expected_outputs = "Byte-for-byte live-Rust artifacts and explicit zero guest exits for successful cases; exact live-Rust diagnostics and explicit guest exit one for every rejected case."
known_non_equivalences = "Native uses bounded resident buffers and 68000 calling conventions; these platform constraints do not alter package-owned selection, legality, diagnostics, or bytes. For unshipped PBcc/PDBcc mnemonics, the legacy Rust frontend parses a syntactically complete operand shape before instruction lookup while the native package frontend stops at the absent family boundary; the exact-diagnostic cases therefore use the shared bare/single-register family boundary. All FPU behavior is deferred to Items 27-29."
fast_proof_command = "cargo test -p asm motorola68020_item26_native_m68030_m68040_package_boundary_matches_rust -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm external_fs_uae_native_m68030_m68040_integer_mmu_parity -- --nocapture --test-threads=1"
regression_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 scripts/workflow/run_native_existing_parity_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_item26_native_m68030_m68040_package_boundary_matches_rust"
proof_level = "B"
proves = "The embedded package equals the live Rust registry build; it owns the m68030/m68040 PFLUSH, MOVE16, MMU MOVEC, ADDA.W carry-forward, and restriction records; the native boundary remains architecture-neutral."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68030_m68040_integer_mmu_parity"
proof_level = "D"
proves = "Fresh challenged guests prove exact live-Rust bytes for complete owned m68030/m68040 fixtures plus directed PFLUSH and ADDA.W cases, and exact live-Rust rejection diagnostics for restrictions and every explicitly unshipped PMMU family, with explicit guest exits."
does_not_prove = "Any m68030/m68040 FPU instruction, which remains deferred to Items 27-29."

[[tests]]
name = "external_fs_uae_native_m68030_cpu_alias_first_long_branch_parity"
proof_level = "D"
proves = "Two fresh guests prove canonical and numeric 68030 source CPU spellings select the same CPU-scoped long-branch package row and exact Rust bytes."
does_not_prove = "Other CPU aliases or m68030 instruction families."

[[tests]]
name = "external_fs_uae_native_m68030_m68040_directed_carry_forward_parity"
proof_level = "D"
proves = "Fresh per-instruction guests isolate every inherited integer form in the authoritative m68030/m68040 carry-forward fixtures, including TRAPNE and both MOVE16 shapes, against exact same-source Rust artifacts."
does_not_prove = "The package-owned PFLUSH and MMU MOVEC forms proved by the aggregate."

[[tests]]
name = "external_fs_uae_native_m68030_zero_operand_exact_mode_parity"
proof_level = "D"
proves = "Two fresh guests prove zero-operand lookup uses the exact canonical implied CTBL mode rather than Rust's semantic TRAPNE placeholder, while the explicit-word form remains unchanged."
does_not_prove = "Nonzero operand-shape lookup, which already supplies an explicit package mode."

[[tests]]
name = "external_fs_uae_native_m68030_unshipped_pbcc_pdbcc_family_parity"
proof_level = "D"
proves = "Two fresh guests prove PBcc and PDBcc stop at the shared unshipped-family boundary with exact same-source Rust diagnostics and explicit guest exit one."
does_not_prove = "Legacy-Rust operand parsing order for otherwise syntactically complete absent-family forms, a documented frontend difference."

[[tests]]
name = "native_existing_parity_completion_wrapper"
proof_level = "D"
proves = "One Item 26 invocation re-proves every established native parity shard and executes the complete Item 26 aggregate exactly once."
does_not_prove = "A second wrapper run after any directed repair; the Directed-Fix and Single Native Completion Quality Gate forbids repetition."
