[slice]
schema_version = 2
name = "native m68080 integer and control v1"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 30
requirements = ["N68X0-001", "N68X0-002", "N68X0-003", "N68X0-004", "N68X0-005", "N68X0-006", "N68X0-014", "N68X0-015", "N68X0-016", "REQ-68080-FULL-001", "REQ-68080-FULL-002", "REQ-68080-FULL-003", "REQ-68080-FULL-004", "REQ-68080-FULL-005", "REQ-68080-FULL-006", "REQ-68080-FULL-007", "REQ-68080-FULL-009", "REQ-68080-FULL-010", "REQ-68080-FULL-011"]
rust_reference = [
  "crates/opforge-families/src/m68k/package_programs.rs::m68020_instruction_programs",
  "crates/opforge-families/src/m68k/package_programs.rs::m68020_mode_selectors",
  "crates/opforge-families/src/m68k/package_programs.rs::m68020_register_encodings",
  "crates/opforge-families/src/m68080/handler.rs",
  "crates/opforge-vm/src/execution_model/selector_encoding.rs::parse_register_index_projection",
  "crates/opforge-vm/src/execution_model/selector_encoding.rs::project_register_index",
  "examples/motorola68000/68080_integer_addressing_matrix.asm"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgParseRegisterClassProjectionV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgBuildCompactSemanticSequenceCandidateV2",
  "native/motorola68000/amigaos/tkpkg/tkpkg_operand_runtime.asm",
  "native/motorola68000/amigaos/tkpkg/tkpkg_encode_service.asm::tkpkgEncodeInstructionEnvelopeV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_state_service.asm"
]
invariant = "For the exact unmodified Rust package, native executes the m68080 integer/control selectors, inherited ADDA.W, register banks, register-index projections, pair/member forms, Apollo state guards, control-register encodings, branch aliases, fixups, and rejection diagnostics through architecture-neutral package operations; CPU, mnemonic, register, opcode, legality, and diagnostic semantics remain package-owned."
assertion_decision = "Prove the complete Rust boundary at Level B and each corrected invariant with a fresh directed Level D guest. After all directed proofs pass, invoke the complete established native parity wrapper exactly once. If that invocation exposes an issue, do not repeat the wrapper; correct the issue if it is a product defect and run only its smallest directed proof."
expected_inputs = "The exact unmodified all-family Rust package; the complete 68080_integer_addressing_matrix fixture; residual inherited ADDA.W, integer, control-register, branch-alias, and Apollo-gated sources; and explicit m68040 rejection sources."
expected_outputs = "Byte-for-byte equality with same-source live Rust artifacts and explicit guest exit zero for successful cases; exact live-Rust diagnostics and explicit guest exit one for Apollo-disabled and earlier-CPU rejection cases."
known_non_equivalences = "Native uses bounded resident buffers, signed-32 scalar transport, and 68000 calling conventions. These fundamental platform constraints do not alter package-owned selection, legality, diagnostics, or bytes; SEMV v7 i64 transform fields outside the exact signed-32 native representation fail closed. The single completion-wrapper invocation encountered an external FS-UAE Work-volume handoff timeout before the schema-listing guest wrote its start marker; the exact unchanged schema-listing shard then passed once as the permitted directed confirmation, so no product correction was made and the wrapper was not repeated. The single Item 30 aggregate invocation attempted all sixteen fresh cases: fourteen passed and two exposed missing neutral SEMV v7 transform and selector-shape-alternative/register-or-named-range handling. The aggregate was not repeated; each corrected invariant was proved by its own fresh directed guest."
fast_proof_command = "cargo test -p asm motorola68020_item30_native_m68080_integer_package_boundary_matches_rust -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm external_fs_uae_native_m68080_integer_parity -- --nocapture --test-threads=1"
regression_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 scripts/workflow/run_native_existing_parity_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_item30_native_m68080_integer_package_boundary_matches_rust"
proof_level = "B"
proves = "The embedded package equals the live Rust registry build and owns the complete m68080 integer/control selector, register-bank, state-guard, branch-alias, inherited ADDA.W, rejection, and neutral register-index projection contracts while generic native sources remain CPU-neutral."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68080_register_index_projection_directed_parity"
proof_level = "D"
proves = "Two fresh guests isolate nonzero shift-and-mask projection for E23 and nonzero mask projection for B7 against exact live-Rust bytes with explicit zero exits."
does_not_prove = "The complete m68080 integer/control surface."

[[tests]]
name = "external_fs_uae_native_m68080_integer_directed_parity"
proof_level = "D"
proves = "Four fresh guests prove the complete checked-in integer matrix, the residual surface including both inherited ADDA.W forms, Apollo-disabled rejection, and an earlier-CPU rejection against live Rust with explicit exits."
does_not_prove = "Every branch/control alias and every aggregate negative variant."

[[tests]]
name = "external_fs_uae_native_m68080_extended_short_v7_directed_parity"
proof_level = "D"
proves = "One fresh guest proves Rust SEMV v7 RangeMap execution for positive and negative extended-short branches with exact bytes, completed protocol, and explicit zero exit."
does_not_prove = "Other SEMV v7 programs or the complete integer/control surface."

[[tests]]
name = "external_fs_uae_native_m68040_b_register_rejection_directed_parity"
proof_level = "D"
proves = "One fresh guest proves Rust selector shape-alternative expansion and register-or-named-range fallback produce the exact package-owned m68040 B-register diagnostic with completed protocol and explicit exit one."
does_not_prove = "Other earlier-CPU rejection variants or the complete integer/control surface."

[[tests]]
name = "external_fs_uae_native_m68080_integer_parity"
proof_level = "D"
proves = "The single invocation attempted all sixteen fresh guests covering the complete matrix, residual integer/control source, all extended-short branch aliases, all control-register aliases, Apollo gating, and earlier-CPU rejection variants; fourteen completed with exact Rust results and the two failures localized the subsequently corrected invariants."
does_not_prove = "The two corrected invariants by itself because the aggregate was not repeated; those are proved by the two directed Level D tests above."

[[tests]]
name = "native_existing_parity_completion_wrapper"
proof_level = "D"
proves = "The one Item 30 invocation passed the first established schema-binary shard, then failed closed when the next fresh guest did not produce a start marker; the exact unchanged schema-listing shard subsequently passed as the sole directed confirmation."
does_not_prove = "Any later wrapper shard, including the Item 30 aggregate, because the single invocation stopped at the fail-closed timeout and repetition is forbidden by the Directed-Fix and Single Native Completion Quality Gate."
