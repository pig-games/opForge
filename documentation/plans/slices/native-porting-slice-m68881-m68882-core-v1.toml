[slice]
schema_version = 2
name = "native m68881 m68882 core v1"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 27
requirements = ["N68X0-001", "N68X0-002", "N68X0-006", "N68X0-014", "N68X0-015", "N68X0-016", "AC-M68KMF-001", "AC-M68KMF-002", "AC-M68KMF-005", "AC-M68KMF-006"]
rust_reference = [
  "crates/opforge-core/src/parser.rs::Parser::parse_primary",
  "crates/opforge-vm/src/execution_model/selector_encoding.rs::semantic_plan_inputs",
  "crates/opforge-families/src/m68k/package_programs.rs::m68020_mode_selectors",
  "crates/opforge-families/src/m68k/package_programs.rs::m68020_register_encodings",
  "crates/opforge-families/src/m68k/package_programs.rs::semantic_programs",
  "crates/opforge-families/src/m68k/fpu_capability.rs",
  "examples/motorola68000/68020_fpu_allmodes.asm",
  "examples/motorola68000/68020_fpu_registers.asm"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgBuildCompactStateCandidateV2",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgBuildCompactSemanticSequenceCandidateV2",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgProjectCallArgRegisterV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_selection_service.asm::tkpkgSelectCallArgumentV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_encode_service.asm::tkpkgEncodeInstructionEnvelopeV1"
]
invariant = "For the exact unmodified Rust package, native evaluates the package-owned external-FPU state guard, executes its complete nested neutral semantic plan, projects Rust named-call arguments in source order, and renders package diagnostics with the complete selected mnemonic; all FPU targets, registers, mnemonics, formats, encodings, legality, and diagnostic text remain package-owned."
assertion_decision = "No ad-hoc instrumentation: each corrected neutral invariant is proved first by a directed Level B contract and one fresh challenge-bound Level D guest. After all directed tests succeed, the complete established native parity wrapper runs exactly once; any issue it exposes is repaired and proved only by a directed small test without repeating the wrapper."
expected_inputs = "The exact unmodified all-family Rust package; the 68020_fpu_allmodes and 68020_fpu_registers fixtures transformed only across the four legal m68020/m68030 and 68881/68882 profile pairs; core register/arithmetic, native-format, list/pair, conditional, save/restore forms; disabled-FPU and illegal FMOVE destination/source cases."
expected_outputs = "Byte-for-byte equality with same-source live Rust artifacts and explicit guest exit zero for every positive case; exact live-Rust package diagnostic text and explicit guest exit one for every negative case."
known_non_equivalences = "Native uses bounded resident buffers and 68000 calling conventions; these fundamental platform constraints do not alter the Rust-owned Item 27 source domain, selection, legality, diagnostics, or output bytes. Remaining external-FPU math catalog mnemonics are deferred to Item 28, and integrated m68040 FPU behavior is deferred to Item 29."
fast_proof_command = "cargo test -p asm motorola68020_item27_native_external_fpu_core_package_boundary_matches_rust -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm external_fs_uae_native_m68881_m68882_core_parity -- --nocapture --test-threads=1"
regression_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 scripts/workflow/run_native_existing_parity_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_item27_native_external_fpu_core_package_boundary_matches_rust"
proof_level = "B"
proves = "The embedded package equals the live Rust registry build; CPU state guards, external-FPU selectors, register encodings, semantic programs, and the corrected generic native paths retain package ownership."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68881_core_directed_parity"
proof_level = "D"
proves = "Four fresh guests isolate exact live-Rust register/arithmetic, native-format, list/pair, and conditional/save-restore artifacts under m68020/68881."
does_not_prove = "The complete four-profile aggregate."

[[tests]]
name = "external_fs_uae_native_state_guard_sequence_continuation_parity"
proof_level = "D"
proves = "One fresh guest proves an allowed package state guard records and executes every nested Rust semantic-sequence step."
does_not_prove = "Named-call argument projection or rejection rendering."

[[tests]]
name = "external_fs_uae_native_named_call_argument_register_parity"
proof_level = "D"
proves = "One fresh guest proves the neutral native call projector selects both ordered register arguments from Rust's named `.name(arg0,arg1)` call form."
does_not_prove = "FPU-specific pair semantics outside the supplied package plan."

[[tests]]
name = "external_fs_uae_native_state_guard_rejection_mnemonic_parity"
proof_level = "D"
proves = "One fresh guest proves a rejected state guard renders Rust's complete selected mnemonic after the requirement evaluator returns."
does_not_prove = "Other diagnostic capture fields."

[[tests]]
name = "external_fs_uae_native_m68881_m68882_core_rejection_parity"
proof_level = "D"
proves = "Fresh guests cover the disabled-FPU boundary and illegal FMOVE data, PC-relative, and FPU-register effective-address cases with live-Rust diagnostics and explicit exit one."
does_not_prove = "Successful external-FPU byte emission."

[[tests]]
name = "external_fs_uae_native_m68881_m68882_core_parity"
proof_level = "D"
proves = "Fresh guests prove both complete core fixtures and conditional/save-restore forms across all four legal m68020/m68030 plus 68881/68882 profile pairs, together with the owned rejection matrix, against exact same-source Rust results."
does_not_prove = "Item 28's remaining external-FPU math catalog or Item 29's integrated m68040 profile."

[[tests]]
name = "native_existing_parity_completion_wrapper"
proof_level = "D"
proves = "One Item 27 invocation re-proves every established native parity shard and executes the complete Item 27 aggregate exactly once."
does_not_prove = "A second wrapper run after any directed repair; the Directed-Fix and Single Native Completion Quality Gate forbids repetition."
