invariant = "For the exact unmodified Rust package, native executes every remaining external-only 68881/68882 catalog selector through architecture-neutral state, register, immediate, effective-address, sequence, and diagnostic operations; all FPU targets, mnemonics, register meanings, opcodes, legality, and diagnostic text remain package-owned."
assertion_decision = "No production repair was required after the Level B boundary contract and two fresh directed Level D guests passed. The complete established native parity wrapper then runs exactly once; any issue it exposes is repaired and proved only by a directed small test without repeating the wrapper."
expected_inputs = "The exact unmodified all-family Rust package; the complete 68020_fpu_instruction_catalog fixture transformed only across the four legal m68020/m68030 and 68881/68882 pairs; representative integrated-m68040 rejection cases for missing external-only operations; and a disabled external-FPU case."
expected_outputs = "Byte-for-byte equality with same-source live Rust artifacts and explicit guest exit zero for every legal catalog case; exact live-Rust package diagnostic text and explicit guest exit one for integrated-target and disabled-FPU rejections."
known_non_equivalences = "Native uses bounded resident buffers and 68000 calling conventions; these fundamental platform constraints do not alter the Rust-owned Item 28 source domain, selection, legality, diagnostics, or bytes. Integrated m68040 FPU behavior remains Item 29."
fast_proof_command = "cargo test -p asm motorola68020_item28_native_external_fpu_catalog_package_boundary_matches_rust -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm external_fs_uae_native_m68881_m68882_extended_math_parity -- --nocapture --test-threads=1"
regression_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 scripts/workflow/run_native_existing_parity_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_item28_native_external_fpu_catalog_package_boundary_matches_rust"
proof_level = "B"
proves = "The embedded package equals the live Rust registry build and owns all remaining external-only m68020/m68030 selectors plus every integrated-m68040 rejection row, while generic native sources contain no catalog vocabulary."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "external_fs_uae_native_m68881_m68882_extended_math_directed_parity"
proof_level = "D"
proves = "Two fresh guests isolate exact live-Rust bytes for the complete external-only register-math surface and the exact integrated-m68040 FETOX rejection with explicit guest exits."
does_not_prove = "All four legal target pairs or the complete checked-in catalog fixture."

[[tests]]
name = "external_fs_uae_native_m68881_m68882_extended_math_parity"
proof_level = "D"
proves = "Fresh guests prove the complete checked-in FPU instruction catalog across every legal m68020/m68030 plus 68881/68882 pair, along with representative integrated-m68040 and disabled-FPU rejections, against same-source Rust results."
does_not_prove = "Item 29's integrated m68040 positive surface."

[[tests]]
name = "native_existing_parity_completion_wrapper"
proof_level = "D"
proves = "One Item 28 invocation re-proves every established native parity shard and executes the complete Item 28 aggregate exactly once."
does_not_prove = "A second wrapper run after any directed repair; the Directed-Fix and Single Native Completion Quality Gate forbids repetition."
