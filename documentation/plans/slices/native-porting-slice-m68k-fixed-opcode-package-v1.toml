[slice]
schema_version = 2
name = "native compact package fixed and operand-program execution"
kind = "native-rust-parity"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 14
requirements = ["N68X0-001", "N68X0-003", "N68X0-004", "N68X0-008", "N68X0-013", "N68X0-014", "N68X0-015", "N68X0-016"]
rust_reference = [
  "crates/opforge-package/src/package/codec.rs::encode_compact_tabl_chunk",
  "crates/opforge-package/src/package/codec.rs::decode_compact_tabl_chunk",
  "crates/opforge-vm/src/runtime_model_core.rs::RuntimeModelCore::encode_candidates",
  "native/motorola68000/amigaos/opforge-cli/opforge_cli_package.opasm"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_package_loader.asm::validateToc",
  "native/motorola68000/amigaos/tkpkg/tkpkg_compact_table.asm::findFixedProgramFromRequestV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_encode_service.asm::encodeSelectedInstructionV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_encode_service.asm::tkpkgEncodeExecuteProgram"
]
invariant = "The native generic runtime consumes the exact Item 13 Rust-built package bytes, decodes CMSE v7 and CTBL v1 with call-local immutable row state, selects the most-specific active scoped owner, rejects malformed or ambiguous rows, and executes fixed or operand bytecode through the existing neutral opcore without any family, CPU, mnemonic, register, addressing-mode, or opcode constant in production control flow."
expected_inputs = "The unchanged 367,246-byte Item 13 all-family package, a resolved active pipeline, and a selected-instruction request whose mnemonic, shape, mode, plan, and operands are package/runtime data."
expected_outputs = "The exact bytes emitted by the live Rust CLI for the same source/package, with unsupported CTBL versions, malformed lengths, invalid opcodes, missing END, trailing bytes, ambiguous rows, and output overflow failing closed."
known_non_equivalences = "This slice adds compact CMSE raw-plan selection and CTBL lookup over the already-existing neutral EmitU8/EmitOperand/End executor contract. It does not implement CSEM structured/fixup/branch operations, CPRD operand records, new family package data, Hunk/S-record output, or broader 680x0 instruction support; those remain later plan items."
fast_proof_command = "cargo test -p asm motorola68020_item14_native_compact_fixed_opcode_ -- --nocapture && cargo test -p asm motorola68020_opforge_native_cli_shell_assembles_without_selector_stage_fallback -- --nocapture && python3 scripts/workflow/check_cpu_specific_arch_boundary.py"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm external_fs_uae_native_m68k_fixed_opcode_package_parity -- --nocapture --test-threads=1 && OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm external_fs_uae_native_compact_operand_package_parity -- --nocapture --test-threads=1 && OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm external_fs_uae_native_compact_fixed_opcode_rejects_version_and_opcode_mutations -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_item14_native_compact_fixed_opcode_uses_item13_exact_package_digest"
proof_level = "A"
proves = "The embedded native input remains byte-identical to freshly built default Rust package bytes, retains the frozen Item 13 digest, and contains the package-owned fixed program while production source contains no target-owned spelling or opcode."
does_not_prove = "Execution by a real Amiga guest."

[[tests]]
name = "motorola68020_item14_native_compact_fixed_opcode_guards_version_and_malformed_opcodes"
proof_level = "B"
proves = "Native source owns explicit compact version, opcode, termination, and trailing-byte fail-closed branches."
does_not_prove = "That a real guest reaches every failure branch."

[[tests]]
name = "motorola68020_opforge_native_cli_shell_assembles_without_selector_stage_fallback"
proof_level = "B"
proves = "The complete native CLI source, including the new generic compact module, assembles under the 68020 host target without import, syntax, or branch-range failure."
does_not_prove = "Runtime behavior."

[[tests]]
name = "external_fs_uae_native_m68k_fixed_opcode_package_parity"
proof_level = "D"
proves = "A fresh real Amiga guest consumes the exact Rust-built package and emits byte-for-byte the live Rust fixed-opcode artifact with fresh challenge, explicit guest completion, and zero exit."
does_not_prove = "Scalar, record, fixup, branch, Hunk, S-record, or complete family support."

[[tests]]
name = "external_fs_uae_native_compact_operand_package_parity"
proof_level = "D"
proves = "A fresh real Amiga guest uses the exact unmodified combined Rust package, resolves a raw CMSE operand plan into CTBL, executes the pre-existing neutral operand opcore, and emits byte-for-byte the live Rust m6502 artifact."
does_not_prove = "Structured semantic plans, fixups, branches, Hunk, S-record, or complete 680x0 support."

[[tests]]
name = "external_fs_uae_native_compact_fixed_opcode_rejects_version_and_opcode_mutations"
proof_level = "D"
proves = "Fresh real guest cases reject an unsupported compact-table version and a malformed package-program opcode without stale-evidence fallback."
does_not_prove = "Every malformed package shape."

[[tests]]
name = "native_existing_parity_completion_wrapper"
proof_level = "D"
proves = "The complete existing native 65x02 proof remains green against the current Rust-built package after the shared generic runtime change."
does_not_prove = "New 680x0 behavior beyond this fixed-program slice."
