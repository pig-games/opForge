[slice]
schema_version = 2
name = "native macro invocation expansion and artifact parity"
kind = "native-rust-parity"
rust_reference = [
  "crates/opforge-core/src/macro_processor_args_subst.rs::substitute_line",
  "crates/opforge-core/src/macro_processor_definitions.rs::format_macro_block_start",
  "crates/opforge-core/src/macro_processor.rs::MacroProcessor::expand_lines"
]
native_boundary = [
  "native/motorola68000/amigaos/opforge-cli/state.asm::NativeCliPreprocessDefinitionBodyCount",
  "native/motorola68000/amigaos/opforge-cli/preprocessor_substitution.asm::opforgeNativeCliSubstituteMacroBodyLineV1",
  "native/motorola68000/amigaos/opforge-cli/preprocessor_scan.asm::lineContainsMacroDirective",
  "native/motorola68000/amigaos/opforge-cli/preprocessor_expansion.asm::opforgeNativeCliBeginExpandedLineV1",
  "native/motorola68000/amigaos/opforge-cli/preprocessor_expansion.asm::opforgeNativeCliEndExpandedLineV1",
  "native/motorola68000/amigaos/opforge-cli/line_processor.asm::opforgeNativeCliExpandActiveMacroV1",
  "native/motorola68000/amigaos/opforge-cli/line_processor.asm::opforgeNativeCliProcessExpandedLineV1",
  "native/motorola68000/amigaos/opforge-cli/line_processor.asm::opforgeNativeCliProcessExpandedScopeLineV1",
  "native/motorola68000/amigaos/opforge-cli/line_processor.asm::opforgeNativeCliTokenizeCurrentLine",
  "native/motorola68000/amigaos/opasm/opasm_flow_scopes.asm::beginBlockScopeV1"
]
structural_definition_contract = "The existing fixed definition header/body/count/length arrays are the shared inert record representation. preprocessor_definitions owns current macro name/signature, bounded body span, and macro-kind capture; preprocessor_invocation owns the attached caller-label state; line_processor owns macro expansion and scope policy. Segment and statement kind values are declared but have no allocated active record, scanner route, capture path, invocation path, or export behavior."
scanner_contract = "preprocessor_scan owns the bounded token-boundary recognizers. Macro scanning accepts mixed-case standalone `.macro` tokens only at whitespace boundaries, accepts a trailing comment boundary, stops at comments, and ignores quoted text; truncated/prefixed forms fail. Segment and statement directives remain inactive."
invariant = "Each active macro invocation emits Rust-compatible `.block`/`.endblock` scope records. Substituted body lines route through tokenizer → PRVM → session; generated scope lines route through the documented source/session fallback. Both routes save the caller source in the expansion owner, close that frame before returning the route status, and reject a nested frame without overwriting the caller frame."
frontend_contract = "preprocessor_expansion owns current-source replacement, saved-source bytes, current/saved line lengths, and expansion depth. line_processor owns route selection and statement-index advancement through the existing session APIs: ordinary lines invoke tokenizer → PRVM → session, while generated scope lines invoke source/session fallback. The route status is saved before EndExpandedLine and restored after it, so staging cleanup cannot hide tokenizer, PRVM, source-record, or statement-record failure. On route or cleanup failure, the engine checkpoint restores source-record count, statement count, image-byte count, and PC, while the source-frame owner restores caller source bytes and length and clears expansion depth."
transaction_contract = "Before either expanded route records into the opasm session, line_processor checkpoints source-record count, statement count, image byte count, and PC. Route or staging-cleanup failure restores the caller source through preprocessor_expansion and rolls the engine collection back to that checkpoint. Invocation body index advances only after a committed body route; scope depth is not mutated during frontend staging."
resource_budget_contract = "constants owns the fixed capacities and exact contiguous reset-size formula. state owns separate definition-header (name/signature), body-line, positional-argument, full-list, label, saved-line, and expansion-line buffers; equal byte values do not imply shared storage. preprocessor_definitions, preprocessor_invocation, preprocessor_substitution, and preprocessor_expansion reject a full count or text buffer before the corresponding write. ResetPreprocessorV1 clears the complete region each CLI session. Definitions and body lines are partitioned per definition; arguments are cumulative per one invocation frame; source, saved, and expansion lines are separate one-frame stores. Segment and statement capacities remain inactive."
assertion_decision = "No runtime assertion: fixed output capacity and the active-frame sentinel return deterministic failure before source recording can continue."
expected_inputs = "An active bounded macro invocation frame with captured body lines and positional, full-list, named, and default parameter bindings, including a leading-dot macro call and a source .cpu 65c02 directive."
expected_outputs = "A caller label attaches to the generated `.block`, anonymous blocks balance without a synthetic symbol prefix, substituted body lines use the existing source/tokenizer/PRVM/session path while restoring the caller line, and the macro fixture emits A5 12 85 34 01 02 03 03 00 09 00."
known_non_equivalences = "This macro-only fixture deliberately excludes segments, statements, recursion diagnostics, and semantic errors outside the named invocation path."
fast_proof_command = "cargo test -p asm native_preprocessor_macro_substitution_and_reentry_are_bounded -- --nocapture && cargo test examples_match_reference_outputs -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN=/Applications/FS-UAE.app/Contents/MacOS/fs-uae OPFORGE_FS_UAE_CONFIG_TEMPLATE=/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae OPFORGE_FS_UAE_ARGS='{fsuae_config}' OPFORGE_FS_UAE_TIMEOUT_MS=120000 OPFORGE_FS_UAE_POST_START_TIMEOUT_MS=60000 cargo test -p asm native_macro_invocation_fixture_fs_uae -- --nocapture --test-threads=1"
level_d_fail_closed = true
level_d_completion_wrapper = "scripts/workflow/run_native_macro_completion.sh --verify"
level_d_manifest_validator = "scripts/workflow/check_native_macro_level_d_manifest.py"

[[tests]]
name = "native_preprocessor_macro_substitution_and_reentry_are_bounded"
proof_level = "C"
proves = "Rust confirms positional, at-positional, full-list, named, and label-scope semantics while the native source contract proves bounded substitution helpers and ordinary-path re-entry with caller restoration."
does_not_prove = "Native 68020 execution, complete artifact parity, or FS-UAE behavior."

[[tests]]
name = "native_preprocessor_expanded_line_frontend_contract_routes_and_restores"
proof_level = "B"
proves = "The native source contract keeps ordinary tokenizer routing and structural source/session routing distinct, and restores the staged caller line before returning either route status."
does_not_prove = "Native execution, tokenizer/session fault injection, or transactional rollback beyond the staged source frame."

[[tests]]
name = "native_preprocessor_expanded_line_failure_restores_caller_state"
proof_level = "B"
proves = "The expanded body route checkpoints and rolls back source-record, statement, image-byte, and PC state after a route or cleanup failure while EndExpandedLine restores the caller line."
does_not_prove = "Guest-side tokenizer/PRVM fault injection or a full native execution trace of every session mutation."

[[tests]]
name = "native_preprocessor_generated_scope_failure_is_transactional"
proof_level = "B"
proves = "Generated scope recording uses the same checkpoint, caller-line restoration, and engine rollback contract as an expanded body route."
does_not_prove = "Guest-side parser fault injection or scope activation beyond the frontend record boundary."

[[tests]]
name = "native_preprocessor_capacity_matrix_is_deterministic"
proof_level = "C"
proves = "The named capacity matrix maps every active native macro/preprocessor allocation to its state owner, reset lifetime, and a source-level pre-mutation guard, including partitioned definition/body storage and cumulative invocation arguments."
does_not_prove = "Native 68020 execution, dynamic Rust capacity equivalence, or activation of segment/statement storage."

[[tests]]
name = "native_preprocessor_structural_scanner_boundary_matrix_is_bounded"
proof_level = "C"
proves = "The bounded scanner contract accepts only complete, mixed-case macro and endmacro directive tokens at declared boundaries; comments outside quotes terminate scanning, quoted text is ignored, and segment/statement behavior remains inactive."
does_not_prove = "Native 68020 execution of every malformed source line, macro expansion semantics, or activation of segment and statement definitions."

[[tests]]
name = "examples_match_reference_outputs"
proof_level = "C"
proves = "The Rust authority and checked-in macro fixture references agree on the 11-byte output and listing artifacts."
does_not_prove = "Native execution or FS-UAE behavior."

[[tests]]
name = "native_macro_invocation_fixture_fs_uae"
proof_level = "D"
proves = "The real native CLI under FS-UAE selects the embedded 65c02 pipeline and emits bytes equal to the Rust authority for COPY, PAIR defaults, TEXT expressions, and a labeled leading-dot LOCAL call."
does_not_prove = "Segments, statements, recursive macros, or diagnostics outside this intentionally macro-only fixture."

[[tests]]
name = "native_macro_preprocessor_harness_fs_uae_proves_capture_lookup_and_nested_frame_rejection"
proof_level = "D"
proves = "A real 68020 harness proves a recognized nested macro call fails while the active caller frame, bound arguments, and restored caller source line remain intact."
does_not_prove = "Recursive macro expansion beyond the declared one-frame native limit."
