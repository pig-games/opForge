[slice]
schema_version = 2
name = "opasm operand/evaluation request construction ownership"
kind = "native-rust-parity"
rust_reference = ["crates/opforge-asm/src/asmline.rs"]
native_boundary = [
  "native/motorola68000/amigaos/opasm/opasm_assembly_driver.asm::prepareEvaluateExpressionRequest",
  "native/motorola68000/amigaos/opasm/opasm_operand_eval.asm::prepareExpressionRequestV1"
]
invariant = "The operand/evaluation owner constructs engine request envelopes from existing statement/expression text and a supplied service frame; driver-owned dispatch, diagnostics, fallback policy, PC, and emitted bytes remain unchanged."
expected_inputs = "Existing statement indexes or bounded expression text and the current OPASM_SERVICE frame."
expected_outputs = "The same status and request-byte count supplied to existing tkpkg dispatch paths."
known_non_equivalences = "No selector adaptation, data/text emission, layout, CPU, family, dialect, instruction, segment, or statement behavior is added."
fast_proof_command = "cargo test -p asm motorola68020_opasm_operand_eval_owns_request_construction -- --nocapture && python3 scripts/workflow/check_native_runtime_boundary_inventory.py"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm external_fs_uae_native_cli_flow_navigation_preserves_nested_structural_skips -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_opasm_operand_eval_owns_request_construction"
proof_level = "B"
proves = "The driver delegates request-envelope construction to the operand/evaluation owner."
does_not_prove = "Native guest behavior or new language support."

[[tests]]
name = "external_fs_uae_native_cli_flow_navigation_preserves_nested_structural_skips"
proof_level = "D"
proves = "The existing real native CLI still completes the established two-pass conditional fixture."
does_not_prove = "All operand forms or new selector semantics."
