[slice]
schema_version = 2
name = "opasm selector-encode adaptation ownership"
kind = "native-rust-parity"
rust_reference = ["crates/opforge-asm/src/asmline.rs"]
native_boundary = [
  "native/motorola68000/amigaos/opasm/opasm_assembly_driver.asm::opasmDriverEmitImageBytes",
  "native/motorola68000/amigaos/opasm/opasm_tkpkg_bridge.asm::adaptSelectedEncodeRequestV1"
]
invariant = "The bridge adapts a prepared selected-instruction request into the existing tkpkg encode service; driver-owned image append, diagnostics, and fallback decisions remain unchanged."
expected_inputs = "Existing OPASM_SERVICE frame and prepared request byte count."
expected_outputs = "The unchanged tkpkg status, output length, and last-error length tuple."
known_non_equivalences = "No selector policy, instruction support, data/text emission, layout, CPU, family, dialect, segment, or statement behavior is added."
fast_proof_command = "cargo test -p asm motorola68020_opasm_tkpkg_bridge_owns_selector_encode_adaptation -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm external_fs_uae_native_cli_flow_navigation_preserves_nested_structural_skips -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_opasm_tkpkg_bridge_owns_selector_encode_adaptation"
proof_level = "B"
proves = "Both driver selected-encode paths delegate to the bridge adapter."
does_not_prove = "New selector semantics or native guest behavior."

[[tests]]
name = "external_fs_uae_native_cli_flow_navigation_preserves_nested_structural_skips"
proof_level = "D"
proves = "The existing native CLI completes the established conditional fixture."
does_not_prove = "All selector and encoding combinations."
