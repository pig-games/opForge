[slice]
schema_version = 2
name = "opcore expression bridge ownership"
kind = "native-rust-parity"
rust_reference = [
  "crates/opforge-vm/src/runtime_expr_parser.rs::ExvmScalarExpressionParser",
  "crates/opforge-core/src/expression.rs::parse_number_text",
  "crates/opforge-core/src/expr_vm.rs"
]
native_boundary = [
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::opcoreExprEvalOperandV1",
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::opcoreExvmEvalOperandV1",
  "native/motorola68000/amigaos/exprvm/exprvm_runtime.asm::exprvmEvalProgramV1"
]
invariant = "The retained bridge is the sole native bounded scalar text-to-ExprVM frontend: it compiles literals and symbol names to versioned bytecode and invokes the evaluator while request envelopes, diagnostics, evaluator semantics, package selection, and engine/context state remain with their established owners."
assertion_decision = "No runtime assertion: this ownership-only narrowing makes existing compiler helpers private; focused source contracts pin the two-entry public ABI and sole ExprVM dependency."
expected_inputs = "The unchanged operand pointer/length, bounded symbol snapshot, current address, parser/evaluator opcode versions, and pass number."
expected_outputs = "The unchanged bridge status, scalar value, symbol-reference flags, diagnostics projected by the caller, and emitted CLI bytes."
known_non_equivalences = "Ownership-only ABI narrowing: compiler helpers become private. No grammar, literal, symbol fallback, evaluator, diagnostic, package, CPU/family/dialect, segment, statement, or output behavior changes."
fast_proof_command = "cargo test -p asm motorola68020_opcore_expr_bridge_owns_first_run_scalar_expr_path -- --nocapture && cargo test -p asm motorola68020_exprvm_runtime_owns_bytecode_evaluator -- --nocapture && python3 scripts/workflow/check_native_runtime_boundary_contract.py && python3 scripts/workflow/check_native_runtime_boundary_inventory.py"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm native_expression_ -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_opcore_expr_bridge_owns_first_run_scalar_expr_path"
proof_level = "B"
proves = "The retained frontend has exactly two public entries, imports only ExprVM runtime, keeps compiler helpers private, and contains the established versioned scalar compiler/runtime boundary."
does_not_prove = "Real native execution or preservation of every expression result."

[[tests]]
name = "native_expression_context_forward_label_fs_uae"
proof_level = "D"
proves = "The real native CLI preserves pass-sensitive forward-symbol expression bytes against the Rust oracle through the retained bridge."
does_not_prove = "Every expression operator, package, or diagnostic path."
