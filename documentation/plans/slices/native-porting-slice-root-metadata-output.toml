[slice]
schema_version = 2
name = "native root metadata output selection"
kind = "native-rust-parity"
rust_reference = [
  "crates/opforge-asm/src/asmline_directives_metadata.rs",
  "crates/opforge-vm/src/output_artifacts.rs",
  "crates/opforge-vm/src/output_components.rs"
]
native_boundary = [
  "native/motorola68000/amigaos/opforge-cli/metadata.asm::root metadata routing and output request capture",
  "native/motorola68000/amigaos/opforge-cli/source_artifacts.asm::metadata artifact path selection",
  "native/motorola68000/amigaos/opasm/opasm_output_artifacts.asm::Rust-equivalent listing and HEX rendering",
  "native/motorola68000/amigaos/opasm/opasm_flow_scopes.asm::root module name retention for listing qualification"
]
invariant = "Root block and inline metadata are consumed before instruction selection, metadata output requests are retained in source order, and BIN/LST/HEX artifacts are rendered from the same final native image/source/symbol state as the same-source Rust CLI case."
expected_inputs = "The exact stored CPU-neutral or 6502/65C02 root source, its root metadata names/output selections, the CLI BIN request, and the assembled source/symbol/image state."
expected_outputs = "The CLI-requested BIN plus every metadata-selected LST/HEX artifact at Rust-equivalent paths with byte-for-byte Rust-equivalent contents."
known_non_equivalences = "This slice does not implement qualified logical-section imports or imported section-origin behavior, which remain Items 8.4 and 8.5."
fast_proof_command = "cargo test -p asm motorola68020_item83_native_root_metadata_routes_output_artifacts -- --nocapture && cargo test -p asm motorola68020_opforge_native_cli_shell_assembles_without_selector_stage_fallback -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' RUST_TEST_THREADS=1 cargo test -p asm native_item83_root_metadata_artifacts_fs_uae -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_item83_native_root_metadata_routes_output_artifacts"
proof_level = "B"
proves = "Root metadata has one native router and metadata list/hex/bin selections reuse the post-pass artifact owner."
does_not_prove = "Real guest execution or artifact bytes."

[[tests]]
name = "native_item83_root_metadata_artifacts_fs_uae"
proof_level = "D"
proves = "All three mandatory stored metadata roots freshly complete in FS-UAE with explicit zero exits and exact same-case in-memory Rust BIN/LST/HEX artifact sets."
does_not_prove = "Qualified-section-map or imported-origin behavior assigned to Items 8.4 and 8.5."
