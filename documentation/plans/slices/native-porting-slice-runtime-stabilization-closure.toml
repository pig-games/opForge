[slice]
schema_version = 2
name = "native runtime stabilization closure and parent handoff"
kind = "native-rust-parity"
rust_reference = [
  "live Rust CLI diagnostic routing and established native parity authorities"
]
native_boundary = [
  "completed native preprocessor stabilization plan",
  "documentation/plans/opforge-native-cli-reference-parity-expansion-plan-v0_1.md",
  "documentation/architecture/native-runtime-boundary-contract-v0_1.md",
  "documentation/architecture/native-runtime-boundary-inventory-v0_1.md"
