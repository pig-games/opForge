[slice]
schema_version = 2
name = "native suffixed-number bitwise boundary parity"
kind = "native-rust-parity"
rust_reference = [
  "crates/opforge-core/src/expr.rs::parse_bitwise_and",
  "crates/opforge-core/src/expr.rs::parse_bitwise_xor",
  "crates/opforge-core/src/expr.rs::parse_bitwise_or",
]
native_boundary = [
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::parseSuffixedNumber",
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::compileBitwiseAnd",
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::compileBitwiseXor",
  "native/motorola68000/amigaos/opcore/opcore_expr_bridge.asm::compileBitwiseOr",
]
invariant = "A digit-led suffixed literal backs up both its scan pointer and remaining length before &, |, or ^ so the suffix is excluded from the literal body and the established bitwise tiers own the operator."
assertion_decision = "No runtime assertion: explicit delimiter branches and the expanded exact bitwise guest corpus prove scanner/tier ownership."
expected_inputs = "H-suffixed hexadecimal operands joined by &, |, and ^, plus existing prefixed-literal and logical-yield controls."
expected_outputs = "All bitwise expressions emit exact live Rust values without being misclassified as unresolved labels or malformed literals."
known_non_equivalences = "Any later complete syntax.asm failure after the bitwise lines is a separate invariant."
fast_proof_command = "cargo test -p asm native_expression_bitwise_ -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' cargo test -p asm native_expression_bitwise_ -- --nocapture --test-threads=1"
level_d_fail_closed = true

[[tests]]
name = "native_expression_bitwise_rust_oracle"
proof_level = "A"
proves = "Live Rust values and precedence for prefixed and suffixed bitwise operands plus logical OR yielding."
does_not_prove = "Native scanner ownership or guest execution."

[[tests]]
name = "native_expression_bitwise_parser_runtime_contract"
proof_level = "B"
proves = "The native suffixed-number scanner restores its pointer/length pair and yields all bitwise delimiters to the established compiler tiers."
does_not_prove = "Real 68020 execution or final CLI artifacts."

[[tests]]
name = "native_expression_bitwise_fs_uae"
proof_level = "D"
proves = "FS-UAE emits exact live Rust bytes for the complete expanded bitwise corpus."
does_not_prove = "Later unrelated complete-source expression or directive behavior."
