[slice]
schema_version = 2
name = "tkpkg encode service ownership"
kind = "native-rust-parity"
rust_reference = [
  "existing package-backed table lookup, encoding-program execution, and emitted bytes remain the behavioral authority"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_service.asm::handleEncodeInstruction",
  "native/motorola68000/amigaos/tkpkg/tkpkg_service.asm::handleEncodeSelectedInstruction",
  "native/motorola68000/amigaos/tkpkg/tkpkg_encode_service.asm::encodeInstructionV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_encode_service.asm::encodeSelectedInstructionV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_encode_service.asm::tkpkgEncodeFindAndExecuteTableProgram"
]
invariant = "The existing package-table lookup, encoding-program execution, selected-envelope encoding, and encoded-output construction move behind one owner while preserving selector ordering, statuses, diagnostics, and emitted bytes exactly."
expected_inputs = "Existing encode-instruction and encode-selected control-block requests against established package-backed fixtures."
expected_outputs = "The same selected candidate, encoded bytes, output length, status code, and diagnostic text as before the ownership-only move."
known_non_equivalences = "No CPU, family, dialect, instruction, plan-tag, selector-order, encoding, diagnostic-wording, or expression-language change."
fast_proof_command = "cargo test -p asm motorola68020_tkpkg_encode_service_has_one_implementation_owner -- --nocapture && cargo test -p asm motorola68020_item6_ -- --nocapture && cargo test -p asm motorola68020_opforge_native_cli_shell_assembles_without_selector_stage_fallback -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' scripts/workflow/run_native_macro_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_tkpkg_encode_service_has_one_implementation_owner"
proof_level = "B"
proves = "The service facade delegates both encoding entry paths and the encode service exclusively owns package-table interpretation and output construction."
does_not_prove = "Guest execution of every package, CPU target, or instruction form."

[[tests]]
name = "motorola68020_item6_7_full_indicated_fixture_native_cli_parity_matches_rust_bytes"
proof_level = "C"
proves = "The affected native CLI encoding corpus retains exact Rust-matching bytes."
does_not_prove = "New plan tags or target-CPU support."

[[tests]]
name = "native_macro_completion_wrapper"
proof_level = "D"
proves = "The established real native 65C02 CLI macro path retains exact fixture behavior after the ownership extraction."
does_not_prove = "New CPU/family/dialect support or generic target-CPU parity."
