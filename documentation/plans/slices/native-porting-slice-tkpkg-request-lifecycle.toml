[slice]
schema_version = 2
name = "tkpkg service request lifecycle ownership"
kind = "native-rust-parity"
rust_reference = [
  "existing Rust CLI/package request lifecycle and diagnostic projection remain the behavioral authority"
]
native_boundary = [
  "native/motorola68000/amigaos/tkpkg/tkpkg_service.asm::dispatchV1",
  "native/motorola68000/amigaos/tkpkg/tkpkg_service_request.asm",
  "native/motorola68000/amigaos/tkpkg/tkpkg_service_status.asm",
  "native/motorola68000/amigaos/tkpkg/tkpkg_buffers.asm::ControlBlockV1"
]
invariant = "For an unchanged service request, bootstrap header bytes, request identifier progression, control-block validation result, cleared input/extension/output fields, service ordinal result, and status projection remain exact while lifecycle implementation has one owner. The facade delegates only; it does not implement reusable bootstrap, validation, or request bookkeeping logic."
expected_inputs = "Every existing tkpkg ABI ordinal, including init and malformed control-block requests."
expected_outputs = "The same control-block header bytes, request id, validation status, cleared request windows, and caller-visible service result as before the ownership-only move."
known_non_equivalences = "No parser, expression, package selection, operand plan, encoding, package-data semantics, or CPU/family/dialect support changes. The retained native 65C02 path is the only production Level D target for this ownership slice."
fast_proof_command = "cargo test -p asm motorola68020_tkpkg_service_writes_little_endian_control_block_bytes -- --nocapture && cargo test -p asm motorola68020_tkpkg_request_lifecycle_has_one_implementation_owner -- --nocapture && cargo test -p asm motorola68020_tkpkg_service_preserves_last_error_roundtrip_contract -- --nocapture && cargo test -p asm motorola68020_opforge_native_cli_shell_assembles_without_selector_stage_fallback -- --nocapture"
level_d_command = "OPFORGE_FS_UAE_SMOKE=1 OPFORGE_FS_UAE_BIN='/Applications/FS-UAE.app/Contents/MacOS/fs-uae' OPFORGE_FS_UAE_CONFIG_TEMPLATE='/Users/erik/Documents/FS-UAE/Configurations/opforge-tkpkg-test.fs-uae' OPFORGE_FS_UAE_ARGS='{fsuae_config}' scripts/workflow/run_native_macro_completion.sh --verify"
level_d_fail_closed = true

[[tests]]
name = "motorola68020_tkpkg_request_lifecycle_has_one_implementation_owner"
proof_level = "B"
proves = "Every former facade request-lifecycle helper is an explicit tail-call adapter and each implementation is owned by the request module."
does_not_prove = "Guest execution or preservation of every service ordinal's bytes."

[[tests]]
name = "motorola68020_tkpkg_service_writes_little_endian_control_block_bytes"
proof_level = "C"
proves = "The host-side source contract retains ABI header bytes, request-id progression, validation sequence, and dispatch surface."
does_not_prove = "Real native execution of every package service route."

[[tests]]
name = "native_macro_completion_wrapper"
proof_level = "D"
proves = "The established real native 65C02 CLI path retains its exact macro fixture bytes and nested-frame rejection behavior after the shared lifecycle-owner extraction."
does_not_prove = "New CPU/family/dialect support, generic tokenizer CPU parity, or any service semantic outside the retained 65C02 CLI path and named lifecycle contracts."
