[slice]
schema_version = 1
name = "all-family neutral package improvement adoption"
kind = "package-runtime"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 12
requirements = ["N68X0-003", "N68X0-013", "N68X0-015", "N68X0-016", "N68X0-017"]
rust_reference = [
  "crates/opforge-families/src/lib.rs::package_improvement_applicability_matrix_covers_every_registered_family_and_item",
  "crates/opforge-families/src/intel8080/package_programs.rs",
  "crates/opforge-families/src/m6800/package_programs.rs",
  "crates/opforge-families/src/m68k/package_programs.rs",
  "crates/opforge-families/src/mos6502/package_programs.rs",
  "crates/opforge-vm/src/runtime_tests.rs::serialized_all_family_adoptions_match_existing_scalar_record_and_encoding_oracles"
]
boundary = "Item 12 adds no VM opcode or record version. It audits every neutral package improvement from Items 1-11 against the four families returned by the live registry, mechanically adds only representations of existing family semantics, and records a concrete semantic reason wherever a primitive cannot preserve that family's behavior or would duplicate an already canonical neutral package path."
invariant = "Every registered family has exactly one adopted, common-path, or not-applicable cell for every Item 1-11 operation. Adopted cells are carried by the normal Rust-built package and execute from serialized bytes after registry destruction. Common-path cells identify the narrower canonical package authority that already preserves the behavior. Not-applicable cells identify the exact family-semantic mismatch and do not hide an unported behavior behind a generic runtime callback."
expected_inputs = "The live four-family registry and the canonical Rust package builder after Items 1-11."
expected_outputs = "A complete 4 x 11 matrix, unchanged family source semantics and diagnostics, serialized-only equality with existing family oracles, and no native production-source change."
known_non_equivalences = "This audit does not migrate complex Zilog operand transformations into exact mnemonic selectors; it does not flatten 65816 instruction-induced and arbitrary-scalar state into the finite STVM v1 matrix; and it does not invent automatic branch sizing for families whose source language uses distinct fixed-width branch mnemonics. Those are semantic non-equivalences, not deferred mechanical migrations. The m68k callback cutover remains Item 13."
fast_proof_command = "cargo test -p families package_improvement_applicability_matrix_covers_every_registered_family_and_item -- --nocapture && cargo test -p vm serialized_all_family_adoptions_match_existing_scalar_record_and_encoding_oracles -- --nocapture && cargo test -p asm motorola68020_tkpkg_smoke_package_fixture_matches_authoritative_registry -- --nocapture && cargo test -p asm motorola68020_embedded_native_cli_package_matches_rust_default_runtime_package -- --nocapture"
full_gate_command = "cargo test -p package && cargo test -p registry && cargo test -p families && cargo test -p vm && python3 scripts/workflow/check_cpu_specific_arch_boundary.py && RUST_TEST_THREADS=1 scripts/workflow/run_rust_quality_gate.sh && make workflow-gate"
native_proof = "not-applicable: Item 12 changes no native production source; checked-in package fixtures are exact Rust-builder output and the focused package remains within the unchanged 8,192-byte native allocation"

# Status vocabulary:
# - adopted: the normal Rust-built package carries the applicable neutral program.
# - common_path: the family already uses a narrower canonical neutral package
#   path; adding the newer optional representation would duplicate authority.
# - not_applicable: the family has no matching semantic concept, or the primitive
#   cannot preserve the existing family behavior described by evidence.

[[applicability]]
key = "intel8080:item01"
status = "common_path"
evidence = "Fixed literal/operand emission is already canonical TABL package data for the family; duplicating every fixed row in optional SEMV v1 would create a second encoding authority."

[[applicability]]
key = "intel8080:item02"
status = "adopted"
evidence = "intel8080/package_programs.rs carries family-scoped unsigned byte and word VALP programs compiled from existing operand bounds."

[[applicability]]
key = "intel8080:item03"
status = "adopted"
evidence = "intel8080/package_programs.rs carries register, indirect-register, absolute-word, and immediate OPRD v1 constructors."

[[applicability]]
key = "intel8080:item04"
status = "not_applicable"
evidence = "Intel register pairs are atomic register operands and current indexed operands are already resolved TABL byte candidates; the family has no nested/list/range/field record contract requiring OPRD v2."

[[applicability]]
key = "intel8080:item05"
status = "not_applicable"
evidence = "The registered Intel family has no coprocessor/vector composite operand model."

[[applicability]]
