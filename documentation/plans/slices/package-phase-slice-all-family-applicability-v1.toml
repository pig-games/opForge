evidence = "The package compiler derives all eight exact no-operand aliases RLCA→RLC, RRCA→RRC, RLA→RAL, RRA→RAR, CPL→CMA, SCF→STC, CCF→CMC, and HALT→HLT from the authoritative ZILOG_DIALECT_MAP into dialect-scoped SLCT v1 mappings. Operand-transforming mappings remain family-owned."

