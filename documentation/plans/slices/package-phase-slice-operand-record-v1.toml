[slice]
schema_version = 1
name = "versioned portable base operand records"
kind = "package-runtime"
plan = "documentation/plans/opforge-native-amigaos-680x0-full-support-self-hosting-plan-v0_1.md"
plan_item = 3
requirements = ["N68X0-001", "N68X0-003", "N68X0-004", "N68X0-005", "N68X0-014", "N68X0-015"]
rust_reference = [
  "crates/opforge-families/src/m68k/operand.rs::FamilyOperand",
  "crates/opforge-families/src/m68k/package_programs.rs::operand_record_programs",
  "crates/opforge-families/src/mos6502/package_programs.rs::operand_record_programs",
  "crates/opforge-package/src/package.rs::OperandRecordProgramDescriptor",
  "crates/opforge-vm/src/operand_record_vm.rs::execute_operand_record_program",
  "crates/opforge-vm/src/runtime_model_core.rs::RuntimeModelCore::execute_operand_record_program"
]
boundary = "OPRD is an optional, independently versioned, scoped package chunk. Family modules compile source register/address spellings into opaque numeric register and scalar inputs. The generic package/runtime owns only register references, indirect update modes, register/program-counter bases, displacement, index width/scale, absolute width, immediate value, scoped lookup, and deterministic reconstruction. It contains no CPU, register-name, addressing-mode spelling, or instruction dispatch."
invariant = "The normal registry package builder serializes family-owned base operand constructors. After serialization, a reloaded runtime reconstructs register, indirect, postincrement, predecrement, displacement, indexed, absolute, program-counter-relative, and immediate records without invoking a family parser or interpreting register names. Unsupported versions and structurally malformed records fail closed."
expected_inputs = "A canonical hierarchy package with zero or more scoped OPRD descriptors, opaque numeric register references, and already-evaluated scalar inputs."
expected_outputs = "One deterministic neutral operand record or a typed missing-register, missing-value, malformed-program, unsupported-version, unknown-program, or missing-scope failure."
known_non_equivalences = "This slice excludes 68020 full-extension memory-indirect/base-suppressed/index-suppressed records, lists, pairs, groups, bit fields, FPU/AMMX structures, selector order, legality, encoding, fixups, pass stability, native interpretation, output formats, and CLI behavior. Those remain owned by later plan items."
fast_proof_command = "cargo test -p package operand_record -- --nocapture && cargo test -p vm execution_model_reconstructs_base_operand_records_from_serialized_programs -- --nocapture"
full_gate_command = "cargo test -p package && cargo test -p registry && cargo test -p families && cargo test -p vm && python3 scripts/workflow/check_cpu_specific_arch_boundary.py && RUST_TEST_THREADS=1 scripts/workflow/run_rust_quality_gate.sh && make workflow-gate"
native_proof = "not-applicable: Item 3 changes no native production file and the plan forbids FS-UAE as package-phase proof"

[[tests]]
name = "operand_record_program_round_trip_is_canonical_and_optional_for_legacy_packages"
proof_level = "package"
proves = "OPRD round-trips canonically, collapses identical case variants, and packages without OPRD retain their existing canonical bytes."

[[tests]]
name = "operand_record_codec_rejects_unknown_versions_and_malformed_records"
proof_level = "package"
proves = "Unknown versions, invalid update/base/width/scale fields, truncated or trailing payloads, and duplicate scoped ids fail closed."

[[tests]]
name = "operand_record_validator_is_deterministic_for_arbitrary_bytes"
proof_level = "package-fuzz"
proves = "Arbitrary bounded byte streams produce deterministic validation outcomes without panics."

[[tests]]
name = "execution_model_reconstructs_base_operand_records_from_serialized_programs"
proof_level = "runtime"
proves = "The normal package builder emits family-owned m68k and MOS base operand constructors; a serialized-only runtime reconstructs the complete Item 3 base matrix, consumes family-compiled opaque register inputs, reuses neutral absolute/immediate records across families, and returns typed missing-input failures after the registry is dropped."
